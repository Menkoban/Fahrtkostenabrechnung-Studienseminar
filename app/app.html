// Mit Claude-Konto: db (privat je Person, auf allen Geräten). Sonst: dieser Browser.

const Store = {
  mode: "local", docs: {}, col: null, listeners: [], bereit: false,
  async init() {
    const fertig = () => { this.spiegeln(); this.listeners.forEach((fn) => fn()); };
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]); } catch (e) {}
    const uid = user ? await user.id() : null;
    if (db && uid) {
      this.mode = "db";
      this.col = db.collection("data/users/" + uid);
      const timer = setTimeout(() => { if (!this.bereit) { ui.netzHinweis = true; this.bereit = true; fertig(); } }, 10000);
      this.col.onSnapshot((snap) => {
        const docs = {};
        snap.docs.forEach((d) => { if (d.exists) docs[d.id] = d.data(); });
        this.docs = docs;
        // Ein leerer Zwischenstand aus dem Cache ist noch nicht die Antwort des Speichers
        if (!snap.metadata.fromCache) { clearTimeout(timer); ui.netzHinweis = false; this.bereit = true; }
        else if (snap.size) this.bereit = true;
        if (this.bereit) fertig();
      }, (err) => { clearTimeout(timer); ui.fehler = "Deine Daten sind gerade nicht erreichbar. Lade die Seite später neu."; this.bereit = true; fertig(); });

      // Auf claude.ai sollte der Konto-Speicher da sein; fehlt er, deutlich darauf hinweisen

      try { this.docs = JSON.parse(localStorage.getItem("fahrtkosten-v1") || "{}"); } catch (e) { this.docs = {}; }
      try { navigator.storage?.persist?.(); } catch (e) {}
      this.bereit = true;
      fertig();
    }
  },
  async put(id, obj) {
    this.docs = { ...this.docs, [id]: obj };
    if (this.mode === "db") await this.col.doc(id).set(JSON.parse(JSON.stringify(obj)));
    else this.saveLocal();
    this.spiegeln();
    if (this.mode === "local") this.listeners.forEach((fn) => fn());

    const { [id]: _, ...rest } = this.docs;
    this.docs = rest;
    if (this.mode === "db") await this.col.doc(id).delete();
    else { this.saveLocal(); this.listeners.forEach((fn) => fn()); }
  },
  saveLocal() {
    try { localStorage.setItem("fahrtkosten-v1", JSON.stringify(this.docs)); }
    catch (e) { toast("Speichern auf diesem Gerät ist fehlgeschlagen. Bitte eine Sicherung herunterladen."); }
  },
  // Spiegel: bis zu 5 Stände im Gerätespeicher, höchstens einer je halbe Stunde. Leere Stände werden nie gesichert,
  // ältere Stände bleiben stehen – so überlebt eine Sicherung auch ein versehentliches Löschen.
  spiegeln() {
    if (!this.bereit || !Object.keys(this.docs).length) return;
    try {
      const verlauf = sicherungen();
      const jetzt = Date.now();
      const eintrag = { zeit: jetzt, docs: this.docs };
      const alt = verlauf[0];
      // Den jüngsten Stand nur fortschreiben, wenn dabei nichts verloren geht – sonst bleibt er als Rettung stehen
      const nichtsWeg = alt && (!alt.docs.profil?.name || this.docs.profil?.name)
        && Object.keys(this.docs).length >= Object.keys(alt.docs).length;
      if (alt && jetzt - alt.zeit < 30 * 60 * 1000 && nichtsWeg) verlauf[0] = eintrag;
      else verlauf.unshift(eintrag);
      localStorage.setItem("fahrtkosten-verlauf", JSON.stringify(verlauf.slice(0, 5)));
    } catch (e) {}
  },
};

function sicherungen() {
  try { return JSON.parse(localStorage.getItem("fahrtkosten-verlauf") || "[]").filter((s) => s && s.docs); } catch (e) { return []; }
}

function sicherungText(s) {
  const p = s.docs.profil || {};
  const n = Object.keys(s.docs).filter((k) => k.startsWith("f-")).length;
  const zeit = new Date(s.zeit).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  return `${zeit} Uhr: ${p.name ? p.name + ", " : ""}${n} Fahrt${n === 1 ? "" : "en"}`;
}

async function sicherungEinspielen(s, angabenUeberschreiben = false) {
  // Fahrten werden nur ergänzt, nie überschrieben. Angaben und Orte kommen zurück, wenn sie fehlen
  // oder wenn ausdrücklich dieser Stand gewählt wurde.
  for (const [id, doc] of Object.entries(s.docs)) {
    if (!/^(profil|orte|f-[\w-]+)$/.test(id) || !doc || typeof doc !== "object") continue;
    const ersetzen = angabenUeberschreiben && (id === "profil" || id === "orte");
    if (!Store.docs[id] || ersetzen) await Store.put(id, doc);
  }
  if (!Store.docs.profil?.name && s.docs.profil) await Store.put("profil", s.docs.profil);
}

/** Sicherung, aus der sich fehlende Angaben zurückholen lassen (z. B. wenn das Profil plötzlich leer ist). */
function rettungsSicherung() {
  if (profil()?.name) return null;
  return sicherungen().find((s) => s.docs.profil?.name && !s.docs.profil.beispiel) || null;
}

function profil() { return Store.docs.profil || null; }
function orte() { return Store.docs.orte || { orte: [], entfernungen: [] }; }
function fahrten() {
  return Object.entries(Store.docs).filter(([id]) => id.startsWith("f-"))
    .map(([id, f]) => ({ ...f, id })).sort((a, b) => (b.datum + b.abfahrt).localeCompare(a.datum + a.abfahrt));
}
function neueId() { return "f-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

const ui = { view: "fahrten", draft: null, abr: null, toast: "", netzHinweis: false, fehler: "", loeschen: false, bestaetigen: "" };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tagLabel = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short" });
const monatLabel = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { month: "long", year: "numeric" });

function toast(text) {
  ui.toast = text;
  const alt = $(".toast"); if (alt) alt.remove();
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function gehe(view) {
  ui.view = view; ui.loeschen = false; ui.bestaetigen = "";
  document.querySelectorAll("nav.tabs button").forEach((b) => b.toggleAttribute("aria-current", false));
  const tab = view === "edit" ? "fahrten" : view;
  const btn = $(`nav.tabs [data-tab="${tab}"]`); if (btn) btn.setAttribute("aria-current", "page");
  render(); window.scrollTo(0, 0);
}

function eingerichtet() {
  const p = profil(), o = orte();
  return !!(p && p.name && p.iban && o.orte.some((x) => x.typ === "wohnung") && o.orte.length >= 2);
}

function render() {
  const main = $("#main");
  if (!Store.bereit) return;  // erst zeichnen, wenn der Speicher geantwortet hat – sonst wirkt alles leer
  if (ui.fehler) { main.innerHTML = `<div class="banner bad">${esc(ui.fehler)}</div>`; return; }
  profilJetztSpeichern();  // ungespeicherte Eingaben im Profil nie durch Neuzeichnen verlieren
  const v = { fahrten: viewFahrten, edit: viewEdit, abrechnen: viewAbrechnen, einstellungen: viewEinstellungen }[ui.view];
  main.innerHTML = v();
  const hook = { edit: hookEdit, abrechnen: hookAbrechnen, einstellungen: hookEinstellungen, fahrten: hookFahrten }[ui.view];
  if (hook) hook();
  const weiter = $("#entwurf-weiter");
  if (weiter) weiter.addEventListener("click", () => { const e = entwurf(); if (e) { ui.draft = e.draft; gehe("edit"); } });
  const weg = $("#entwurf-weg");
  if (weg) weg.addEventListener("click", () => { entwurfVergessen(); render(); });
  const rettung = $("#rettung");
  if (rettung) rettung.addEventListener("click", async () => {
    const s = rettungsSicherung(); if (!s) return;
    await sicherungEinspielen(s); toast("Angaben wiederhergestellt"); render();
  });
}

function beispielBanner() {
  const rettung = rettungsSicherung();
  return entwurfBanner() + (ui.speicherWarnung ? `<div class="banner bad">Dein Konto-Speicher antwortet gerade nicht. Änderungen landen nur auf diesem Gerät. Bitte die Seite neu laden.</div>` : "")
    + (rettung ? `<div class="banner warn stack" style="gap:8px"><span>Deine persönlichen Angaben fehlen. Auf diesem Gerät gibt es eine automatische Sicherung vom ${esc(sicherungText(rettung))}.</span>
        <button class="btn primary" id="rettung" style="align-self:flex-start">Angaben wiederherstellen</button></div>` : "")
    + (Object.values(Store.docs).some((d) => d && d.beispiel)
      ? `<div class="banner warn">Hier stehen Beispieldaten (Max Mustermann). Unter „Meine Daten“ kannst du sie löschen und deine eigenen eintragen.</div>` : "");
}

// ---------- Fahrten

function viewFahrten() {
  const alle = fahrten().map((f) => ({ f, r: K.berechne(f, orte()) }));
  if (!eingerichtet() && !alle.length) return viewWillkommen();
  const offen = alle.filter(({ f }) => !f.abgerechnetAm);
  const okOffen = offen.filter(({ r }) => !r.fehler.length);
  const summe = okOffen.reduce((s, { r }) => s + r.summe, 0);
  const fristen = okOffen.map(({ r }) => r.fristEnde).sort();
  let html = `<div class="top"><h1>Fahrten</h1><span class="muted small">${Store.mode === "db" ? "in deinem Konto gespeichert" : "nur auf diesem Gerät"}</span></div>
    <div class="stack">${beispielBanner()}${ui.netzHinweis ? `<div class="banner warn">Verbindung langsam. Angezeigte Daten sind evtl. nicht aktuell.</div>` : ""}
    <div class="stub"><div><div class="eyebrow">Noch nicht abgerechnet</div>
      <div><b>${okOffen.length}</b> Fahrt${okOffen.length === 1 ? "" : "en"}${offen.length > okOffen.length ? `, <span style="color:var(--bad)">${offen.length - okOffen.length} unvollständig</span>` : ""}</div>
      <div class="muted small">${fristen.length ? `Erste Frist endet am ${K.deDatum(fristen[0])}` : "Keine Frist offen"}</div></div>
      <div class="betrag"><span class="eyebrow">voraussichtlich</span><span class="num">${K.eur(summe)} €</span>
        <span class="small" style="opacity:.8">davon Tagegeld ${K.eur(okOffen.reduce((s, { r }) => s + r.tagegeld, 0))} €</span></div></div></div>`;
  if (!alle.length) {
    html += `<div class="card stack" style="margin-top:16px"><h3>Noch keine Fahrten</h3><p class="muted">Tippe auf „Neue Fahrt“, am besten direkt nach dem Seminar. Datum, Route und Uhrzeiten reichen.</p></div>`;
  }
  let monat = "";
  alle.forEach(({ f, r }, i) => {
    const m = f.datum.slice(0, 7);
    if (m !== monat) { html += `${monat ? "</div></section>" : ""}<section class="month"><h3>${monatLabel(f.datum)}</h3><div class="list">`; monat = m; }
    const doppelt = !f.abgerechnetAm && konflikte(f, f.id).length;
    const status = f.abgerechnetAm ? `<span class="chip ok">abgerechnet</span>` : r.fehler.length ? `<span class="chip bad">unvollständig</span>`
      : doppelt ? `<span class="chip warn">doppelt?</span>`
      : r.hinweise.length ? `<span class="chip warn">offen · Hinweis</span>` : `<span class="chip">offen</span>`;
    const mehr = K.istMehrtaegig(f);
    const tag = mehr ? `${r.tage || ""} Tage<b>${K.deDatum(f.datum).slice(0, 6)}</b>bis ${K.deDatum(f.datumBis).slice(0, 6)}` : `${tagLabel(f.datum)}<b>${K.deDatum(f.datum).slice(0, 6)}</b>`;
    html += `<button class="item" data-edit="${esc(f.id)}"><span class="tag">${tag}</span>
      <span class="grow"><span class="route">${esc((f.route || []).join(" → "))}</span><br><span class="muted small">${mehr ? "mit Übernachtung · " : ""}${MITTEL[f.verkehrsmittel] || ""}${f.grund ? " · " + esc(f.grund) : ""}${r.tagegeld ? " · Tagegeld" : ""} · ${status}</span></span>
      <span class="amount"><span class="num">${r.fehler.length ? "–" : K.eur(r.summe) + " €"}</span><br><span class="muted small num">${r.km ? K.km(r.km) + " km" : ""}</span></span></button>`;
  });
  if (monat) html += "</div></section>";
  html += `<button class="btn primary fab" id="neu">+ Neue Fahrt</button>`;
  return html;
}

function hookFahrten() {
  document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => {
    const f = Store.docs[b.dataset.edit];
    ui.draft = { ...JSON.parse(JSON.stringify(f)), id: b.dataset.edit, neu: false };
    gehe("edit");

  const n = $("#neu"); if (n) n.addEventListener("click", neueFahrt);
  const w = $("#willkommen-start"); if (w) w.addEventListener("click", () => gehe("einstellungen"));
  const b = $("#willkommen-beispiel"); if (b) b.addEventListener("click", beispielLaden);
}

  if (!eingerichtet()) { toast("Bitte zuerst deine Daten und Orte eintragen"); gehe("einstellungen"); return; }

function schnellRouten() {
  const gesehen = new Set(), liste = [];
  for (const f of fahrten()) {
    const k = (f.route || []).join(" > ");
    if (k && !gesehen.has(k)) { gesehen.add(k); liste.push(f.route); }
    if (liste.length >= 4) break;
  }
  return liste;
}

}

function zahl(text) { const n = parseFloat(String(text).replace(/\./g, "").replace(",", ".")); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; }

function renderRoute() {
  const d = ui.draft;
  $("#route").innerHTML = (d.route || []).map((s, i) => `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ""}<span class="stop">${esc(s)}<button type="button" data-weg="${i}" aria-label="${esc(s)} entfernen">×</button></span>`).join("")
    || `<span class="muted small">Tippe unten die Stationen in der gefahrenen Reihenfolge an.</span>`;
  $("#addstops").innerHTML = orte().orte.map((o) => `<button type="button" data-plus="${esc(o.name)}">+ ${esc(o.name)}</button>`).join("");
  $("#route").querySelectorAll("[data-weg]").forEach((b) => b.addEventListener("click", () => { d.route.splice(+b.dataset.weg, 1); renderRoute(); renderErgebnis(); }));
  $("#addstops").querySelectorAll("[data-plus]").forEach((b) => b.addEventListener("click", () => { d.route = [...(d.route || []), b.dataset.plus]; renderRoute(); renderErgebnis(); }));
}

/** Doppelte Tage und Überschneidungen mit mehrtägigen Reisen – sonst würde z. B. Tagegeld doppelt abgerechnet. */
function konflikte(f, id) {
  if (!f.datum) return [];
  const ende = (x) => (K.istMehrtaegig(x) ? x.datumBis : x.datum);
  const spanne = (x) => (K.istMehrtaegig(x) ? `${K.deDatum(x.datum).slice(0, 6)}–${K.deDatum(x.datumBis)}` : K.deDatum(x.datum));
  return fahrten().filter((o) => o.id !== id && o.datum && o.datum <= ende(f) && f.datum <= ende(o)).map((o) =>
    K.istMehrtaegig(o) || K.istMehrtaegig(f)
      ? `Überschneidet sich mit der Fahrt ${spanne(o)}. Bitte prüfen, sonst wird Tagegeld doppelt abgerechnet.`
      : `Am ${K.deDatum(o.datum)} gibt es schon eine Fahrt. Doppelt eingetragen?`);
}

function renderErgebnis() {
  const r = K.berechne(ui.draft, orte());
  r.hinweise.unshift(...konflikte(ui.draft, ui.draft.id));
  const teile = [];
  if (r.km) teile.push(`<span class="num">${K.km(r.km)} km</span>`);
  if (r.satz) teile.push(`<span class="num">× ${K.eur(r.satz)} €</span>`);
  if (r.tagegeld) teile.push(`<span>+ Tagegeld ${K.eur(r.tagegeld)} €</span>`);
  if (r.uebernachtungsgeld || r.uebernachtungskosten) teile.push(`<span>+ Übernachtung ${K.eur(r.uebernachtungsgeld + r.uebernachtungskosten)} €</span>`);
  if (ui.draft.verkehrsmittel === "mitfahrt" && r.km) teile.push(`<span>(Mitfahrt: keine km-Erstattung)</span>`);
  $("#ergebnis").innerHTML = `<div class="zahlen"><span class="muted small">${teile.join(" ") || "Noch keine Berechnung"}</span>
    <span class="summe">${r.fehler.length ? "–" : K.eur(r.summe) + " €"}</span></div>
    ${r.tagegeldText ? `<div class="tagegeld ${r.tagegeld ? "ja" : ""}">${esc(r.tagegeldText)}</div>` : ""}`;
  const hint = $("#zeit-hint");
  if (hint) hint.textContent = ui.draft.mehrtaegig ? "" : r.beginnIn === "Dienstort"
    ? "Hinfahrt: Start an der Ausbildungsschule nach dem Unterricht. Rückfahrt: wann du wieder zu Hause bist. Die Zeit an der Schule zählt nicht für das Tagegeld."
    : "Hinfahrt: wann du zu Hause losfährst. Rückfahrt: wann du wieder zu Hause bist. Nicht die Ankunft am Seminar!";
  const knopf = $("#tg-knopf");
  if (knopf && !ui.draft.mehrtaegig) {
    knopf.setAttribute("aria-pressed", String(r.tagegeldGewaehlt));
    knopf.textContent = r.tagegeldGewaehlt ? `Tagegeld beantragt (${K.eur(K.TAGEGELD)} €)` : `Tagegeld beantragen (${K.eur(K.TAGEGELD)} €)`;
    const wahl = ui.draft.tagegeldWahl;
    $("#tg-hint").textContent = wahl === "ja" || wahl === "nein"
      ? "Von dir festgelegt." + (r.abwesenheit ? ` Laut Uhrzeiten ${r.tagegeldAutomatisch ? "mehr" : "nicht mehr"} als 8 Std. unterwegs.` : "")
      : r.abwesenheit ? `Automatisch nach den Uhrzeiten (${r.tagegeldAutomatisch ? "mehr" : "nicht mehr"} als 8 Std. unterwegs). Antippen zum Ändern.`
        : "Wird automatisch gesetzt, sobald Hin- und Rückfahrt eingetragen sind. Oder hier antippen.";
    $("#tg-auto").hidden = !(wahl === "ja" || wahl === "nein");
  }
  const rueck = $("#rueckweg");
  if (rueck) {
    const start = (ui.draft.route || [])[0];
    rueck.hidden = !(r.rueckwegFehlt && start);
    rueck.textContent = `↩ Rückfahrt nach ${start || ""} ergänzen`;
  }
  $("#ergebnis").insertAdjacentHTML("beforeend",
    r.fehler.length || r.hinweise.length ? `<ul class="msgs">${r.fehler.map((t) => `<li class="bad">${esc(t)}</li>`).join("")}${r.hinweise.map((t) => `<li class="warn">${esc(t)}</li>`).join("")}</ul>` : "");
}

// ---------- Entwurf: eine angefangene Fahrt übersteht Tabwechsel und das Schließen der App

function entwurfMerken() {
  if (ui.view !== "edit" || !ui.draft) return;
  try { localStorage.setItem("fahrtkosten-entwurf", JSON.stringify({ zeit: Date.now(), draft: ui.draft })); } catch (e) {}
}
function entwurfVergessen() { try { localStorage.removeItem("fahrtkosten-entwurf"); } catch (e) {} }
function entwurf() {
  try { const e = JSON.parse(localStorage.getItem("fahrtkosten-entwurf") || "null"); return e && e.draft ? e : null; } catch (e) { return null; }
}
function entwurfBanner() {
  const e = entwurf(); if (!e || ui.view === "edit") return "";

function abrDefaults() {
  const offen = fahrten().filter((f) => !f.abgerechnetAm);
  const daten = offen.map((f) => f.datum).sort();
  return { von: daten[0] || K.isoHeute(), bis: daten[daten.length - 1] || K.isoHeute(), aus: null, erstellt: null };
}

function abrListe() {
  const a = ui.abr;
  return fahrten().filter((f) => !f.abgerechnetAm && f.datum >= a.von && f.datum <= a.bis)
    .map((f) => { const r = K.berechne(f, orte()); r.hinweise.unshift(...konflikte(f, f.id)); return { f, r }; })
    .sort((x, y) => x.f.datum.localeCompare(y.f.datum));
}

function inhaltText(gewaehlt) {
  const tages = gewaehlt.filter(({ r }) => !r.mehrtaegig).length, mehr = gewaehlt.length - tages;
  const teile = [];
  if (tages) teile.push(`Antrag + ${Math.ceil(tages / 15)} Blatt Anlage`);
  if (mehr) teile.push(`${mehr} eigene${mehr === 1 ? "r" : ""} Antrag für mehrtägige Reise${mehr === 1 ? "" : "n"}`);
  return teile.join(" · ") || "Nichts ausgewählt";
}

function alsBase64(daten) {
  const bytes = typeof daten === "string" ? new TextEncoder().encode(daten) : new Uint8Array(daten);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

async function speichereDatei(name, daten, typ) {
  // Android-App: die Datei landet über die Brücke im Download-Ordner des Handys
  if (window.AndroidApp) {
    const antwort = window.AndroidApp.speichere(name, alsBase64(daten), typ);
    if (!String(antwort).startsWith("ok")) throw new Error(String(antwort).replace(/^fehler:\s*/, ""));
    return;
  }
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) { await dl.save({ filename: name, data: new Blob([daten], { type: typ }) }); return; }
  const url = URL.createObjectURL(new Blob([daten], { type: typ }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function b64(id) {
  const s = $(id).textContent.trim(); const bin = atob(s); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

function hookAbrechnen() {
  const a = ui.abr;
  const neu = () => { a.aus = null; a.erstellt = null; render(); };
  $("#a-von").addEventListener("change", (e) => { if (e.target.value) { a.von = e.target.value; neu(); } });
  $("#a-bis").addEventListener("change", (e) => { if (e.target.value) { a.bis = e.target.value; neu(); } });
  document.querySelectorAll("[data-pick]").forEach((c) => c.addEventListener("change", () => {
    c.checked ? a.aus.add(c.dataset.pick) : a.aus.delete(c.dataset.pick); a.erstellt = null; render(); }));
  $("#pdf").addEventListener("click", async () => {
    const status = $("#pdf-status");
    const gewaehlt = abrListe().filter(({ f, r }) => !r.fehler.length && a.aus.has(f.id));
    status.innerHTML = `<div class="banner info">PDF wird erstellt …</div>`;
    let out;
    try {
      if (!window.PDFLib) throw new Error("Die PDF-Bibliothek ist nicht geladen. Bitte mit Internetverbindung neu laden.");
      out = await K.erzeugePdf(window.PDFLib, { profil: profil(), fahrten: gewaehlt, antragBytes: b64("#pdf-antrag"), anlageBytes: b64("#pdf-anlage") });
    } catch (err) {
      status.innerHTML = `<div class="banner bad">${esc(err.message || "PDF konnte nicht erstellt werden.")}</div>`;
      return;
    }
    const erste = gewaehlt[0].f.datum, letzte = gewaehlt.map(({ f }) => f.datumBis || f.datum).sort().pop();
    a.erstellt = { ids: gewaehlt.map(({ f }) => f.id), belege: gewaehlt.some(({ f }) => f.fahrkarte || f.sonstige || f.uebernachtung === "beleg"),
      mehrtaegig: gewaehlt.some(({ r }) => r.mehrtaegig),
      out, name: `Reisekosten_${K.deDatum(erste)}-${K.deDatum(letzte)}` };
    render();
    await speichereMitMeldung(`${a.erstellt.name}.pdf`, out.bytes, out.zuLang.length
      ? `<br>Bitte im Ausdruck prüfen:<br>${out.zuLang.map((z) => "· " + esc(z)).join("<br>")}` : "");
  });
  hookAbrechnenRest();
  zeigeErstellt();
}

async function speichereMitMeldung(name, bytes, zusatz = "") {
  const status = $("#pdf-status");
  try {
    await speichereDatei(name, bytes, "application/pdf");
    status.innerHTML = `<div class="banner good">${esc(name)} gespeichert${window.AndroidApp ? " (Ordner Download/Fahrtkosten)" : ""}.${zusatz}</div>`;
  } catch (err) {
    status.innerHTML = err && err.code === "declined"
      ? `<div class="banner warn">Speichern abgebrochen. Du kannst die Dateien unten jederzeit erneut speichern.</div>`
      : window.AndroidApp
        ? `<div class="banner bad">Speichern ging nicht: ${esc(err && err.message)}</div>`
        : `<div class="banner bad">Speichern ging in dieser Ansicht nicht. Öffne die App im Browser auf claude.ai und versuche es dort.</div>`;
  }
}

// Vorschau aller Seiten mit pdf.js, damit Antrag und Anlage direkt in der App sichtbar sind
let pdfjsLaden = null;
function ladePdfjs() {
  const skript = (src) => new Promise((ok, fehler) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fehler; document.head.appendChild(s); });
  // Offline-Version (Fahrtkosten-App.html, Android): pdf.js liegt eingebettet in der Datei und wird erst hier geladen
  const quelle = (id, url) => {
    const el = document.getElementById(id);
    return el ? URL.createObjectURL(new Blob([el.textContent], { type: "text/javascript" })) : url;
  };
  pdfjsLaden = pdfjsLaden || skript(quelle("lib-pdfjs", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"))
    .then(() => skript(quelle("lib-pdfjs-worker", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")))
    .then(() => window.pdfjsLib);
  return pdfjsLaden;
}

let vorschauLauf = 0;
async function zeigeVorschau(out) {
  const ziel = $("#vorschau"); if (!ziel) return;
  const lauf = ++vorschauLauf;
  try {
    const pdfjs = await ladePdfjs();
    const doc = await pdfjs.getDocument({ data: out.bytes.slice(0), isEvalSupported: false }).promise;
    const breite = Math.min(ziel.clientWidth || 600, 900);
    const titel = [];
    out.teile.forEach((t) => { for (let i = 0; i < t.seiten; i++) titel.push(`${t.titel}${t.seiten > 1 ? `, Seite ${i + 1}` : ""}`); });
    ziel.innerHTML = "";
    for (let n = 1; n <= doc.numPages; n++) {
      if (!ziel.isConnected || lauf !== vorschauLauf) return;
      const seite = await doc.getPage(n);
      const basis = seite.getViewport({ scale: 1 });
      const vp = seite.getViewport({ scale: (breite / basis.width) * Math.min(window.devicePixelRatio || 1, 2) });
      const fig = document.createElement("figure"); const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height; c.setAttribute("aria-label", `Vorschau Seite ${n}`);
      const cap = document.createElement("figcaption"); cap.textContent = `Seite ${n}: ${titel[n - 1] || ""}`;
      fig.append(c, cap); ziel.appendChild(fig);
      await seite.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
  } catch (err) {
    ziel.innerHTML = `<p class="muted small">Die Vorschau lässt sich hier nicht anzeigen. Die PDF-Dateien oben sind trotzdem vollständig.</p>`;
  }
}

function zeigeErstellt() {
  const a = ui.abr; if (!a || !a.erstellt) return;
  document.querySelectorAll("[data-teil]").forEach((b) => b.addEventListener("click", () => {
    const t = a.erstellt.out.teile[+b.dataset.teil];
    speichereMitMeldung(`${t.dateiname}_${a.erstellt.name.replace("Reisekosten_", "")}.pdf`, t.bytes);
  }));
  const alles = $("#alles-speichern"); if (alles) alles.addEventListener("click", () => speichereMitMeldung(`${a.erstellt.name}.pdf`, a.erstellt.out.bytes));
  zeigeVorschau(a.erstellt.out);
}

// ---------- Profil: speichert sich selbst (kurz nach dem Tippen, beim Verlassen eines Feldes und vor jedem Neuzeichnen)

let profilTimer = null;

function profilAusFormular() {
  const feld = (id) => $("#p-" + id);
  if (!feld("name")) return null;
  const v = (id) => feld(id).value.trim();
  return { ...LEER_PROFIL, name: v("name"), amtsbezeichnung: v("amt"), wohnanschrift: v("adr"), telefon: v("tel"), email: v("mail"),
    iban: v("iban").toUpperCase(), bic: v("bic").toUpperCase(), beschaeftigungsstelle: v("besch"), schule_name_adresse: v("schule"),
    abrechnende_dienststelle: v("rlsb"), bahncard: $("#p-bc").value, standard_verkehrsmittel: $("#p-vm").value, ermaessigungskarte: v("erm"),
    geschaeftskundenrabatt: $("#p-gk").checked, begruendung_kein_geschaeftskundenrabatt: v("gkb") };
}

function profilJetztSpeichern() {
  if (!profilTimer) return;
  clearTimeout(profilTimer); profilTimer = null;
  const neu = profilAusFormular(); if (!neu) return;
  const alt = profil() || {};
  if (Object.keys(neu).every((k) => neu[k] === alt[k]) && !alt.beispiel) return;
  const status = $("#profil-status");
  const iban = neu.iban.replace(/\s/g, "");
  Store.put("profil", neu).then(() => {
    if (status && status.isConnected) status.textContent = iban && !ibanGueltig(iban)
      ? "Gespeichert. Achtung: Die IBAN scheint einen Tippfehler zu haben." : "Gespeichert.";
  }).catch(() => { toast("Speichern hat nicht geklappt. Bitte noch einmal versuchen."); });
}

function hookEinstellungen() {
  const form = $("#form-profil");
  form.addEventListener("submit", (e) => e.preventDefault());
  const planen = () => { clearTimeout(profilTimer); profilTimer = setTimeout(profilJetztSpeichern, 600); $("#profil-status").textContent = "Wird gespeichert …"; };
  form.addEventListener("input", planen);
  form.addEventListener("change", () => { planen(); profilJetztSpeichern(); });
  const speichereOrte = async (o) => { delete o.beispiel; await Store.put("orte", o); render(); };
  // Schnell einrichten: Ausbildungsschule und Studienseminar aus der Liste übernehmen
  $("#s-schule").addEventListener("change", async (e) => {
    const s = SCHULEN_OS[+e.target.value]; if (!s) return;
    profilJetztSpeichern();
    const p = { ...LEER_PROFIL, ...(profil() || {}) };
    const ort = s.adresse.replace(/^.*\d{5}\s*/, "");
    const nr = (p.beschaeftigungsstelle.match(/Schul-Nr\.?\s*\d+/) || [""])[0];
    p.schule_name_adresse = `${s.name}, ${s.adresse}`;
    p.beschaeftigungsstelle = [s.name, nr, ort].filter(Boolean).join(", ");
    if (!p.abrechnende_dienststelle) p.abrechnende_dienststelle = "RLSB Osnabrück, Dezernat 1";
    delete p.beispiel;
    await Store.put("profil", p);
    const o = JSON.parse(JSON.stringify(orte()));
    const schule = o.orte.find((x) => x.typ === "ausbildungsschule");
    if (schule) schule.adresse = s.adresse;
    else o.orte.push({ name: "Schule", typ: "ausbildungsschule", adresse: s.adresse });
    if (!o.orte.some((x) => x.typ === "wohnung")) o.orte.unshift({ name: "Wohnung", typ: "wohnung", adresse: p.wohnanschrift || "" });
    toast(`${s.kurz} übernommen. Bitte die Schul-Nr. ergänzen.`);
    await speichereOrte(o);
  });
  const sem = $("#s-seminar");
  if (sem) sem.addEventListener("click", async () => {
    const o = JSON.parse(JSON.stringify(orte()));
    const seminar = o.orte.find((x) => x.typ === "seminar");
    if (seminar) seminar.adresse = SEMINAR_OS.adresse;
    else o.orte.push({ name: "Seminar", typ: "seminar", adresse: SEMINAR_OS.adresse });
    toast("Studienseminar eingetragen");
    await speichereOrte(o);
  });
  $("#ort-liste").addEventListener("change", async (e) => {
    const s = SCHULEN_OS.find((x) => x.kurz === e.target.value); if (!s) return;
    const o = JSON.parse(JSON.stringify(orte()));
    let name = s.kurz; while (o.orte.some((x) => x.name === name)) name += "+";
    o.orte.push({ name, typ: "sonstiges", adresse: `${s.kurz}, ${s.adresse}` });  // kurz, damit es in Spalte 5b der Anlage passt
    toast(`${s.kurz} als Ort hinzugefügt. Entfernungen unten eintragen.`);
    await speichereOrte(o);
  });
  document.querySelectorAll("[data-ort]").forEach((el) => el.addEventListener("change", async () => {
    const o = JSON.parse(JSON.stringify(orte()));
    const i = +el.dataset.ort, feld = el.dataset.feld, alt = o.orte[i][feld], wert = el.value.trim();
    if (feld === "name") {
      if (!wert || o.orte.some((x, j) => j !== i && x.name === wert)) { toast("Der Kurzname muss eindeutig sein"); el.value = alt; return; }
      o.entfernungen.forEach((e) => { if (e.a === alt) e.a = wert; if (e.b === alt) e.b = wert; });
      for (const f of fahrten()) if ((f.route || []).includes(alt)) { const { id, ...rest } = f; await Store.put(id, { ...rest, route: f.route.map((s) => (s === alt ? wert : s)) }); }
    }
    o.orte[i][feld] = wert; delete o.beispiel; await speichereOrte(o);
  }));
  document.querySelectorAll("[data-ort-weg]").forEach((b) => b.addEventListener("click", async () => {
    const o = JSON.parse(JSON.stringify(orte())); const [weg] = o.orte.splice(+b.dataset.ortWeg, 1);
    o.entfernungen = o.entfernungen.filter((e) => e.a !== weg.name && e.b !== weg.name); await speichereOrte(o);
  }));
  $("#ort-neu").addEventListener("click", async () => {
    const o = JSON.parse(JSON.stringify(orte()));
    const vorschlag = !o.orte.some((x) => x.typ === "wohnung") ? ["Wohnung", "wohnung"] : !o.orte.some((x) => x.typ === "ausbildungsschule") ? ["Schule", "ausbildungsschule"]
      : !o.orte.some((x) => x.typ === "seminar") ? ["Seminar", "seminar"] : ["Ort " + (o.orte.length + 1), "sonstiges"];
    let name = vorschlag[0]; while (o.orte.some((x) => x.name === name)) name += "+";
    o.orte.push({ name, typ: vorschlag[1], adresse: "" }); await speichereOrte(o);
  });
  document.querySelectorAll("[data-ab]").forEach((b) => b.addEventListener("click", async () => {
    const o = JSON.parse(JSON.stringify(orte())); o.streckeAb = b.dataset.ab; await speichereOrte(o);
  }));
  document.querySelectorAll("[data-km-a]").forEach((el) => el.addEventListener("change", async () => {
    const o = JSON.parse(JSON.stringify(orte())); const a = el.dataset.kmA, b = el.dataset.kmB, km = zahl(el.value);
    o.entfernungen = o.entfernungen.filter((e) => !((e.a === a && e.b === b) || (e.a === b && e.b === a)));
    if (km) o.entfernungen.push({ a, b, km });
    delete o.beispiel;  // eigene Eingaben sind keine Beispieldaten mehr
    await Store.put("orte", o); toast(km ? `${a} – ${b}: ${K.km(km)} km gespeichert` : "Entfernung entfernt");
  }));
  $("#export").addEventListener("click", async () => {
    const daten = JSON.stringify({ version: 1, erstellt: K.isoHeute(), docs: Store.docs }, null, 2);
    try { await speichereDatei(`Fahrtkosten-Sicherung_${K.isoHeute()}.json`, daten, "application/json"); toast("Sicherung gespeichert"); }
    catch (err) { if (err && err.code !== "declined") toast("Speichern ging hier nicht"); }
  });
  $("#import").addEventListener("change", async (e) => {
    const datei = e.target.files[0]; if (!datei) return;
    try {
      const inhalt = JSON.parse(await datei.text());
      if (!inhalt.docs || typeof inhalt.docs !== "object") throw new Error();
      for (const [id, doc] of Object.entries(inhalt.docs)) if (/^(profil|orte|f-[\w-]+)$/.test(id) && doc && typeof doc === "object") await Store.put(id, doc);
      toast("Sicherung eingespielt"); render();
    } catch (err) { toast("Diese Datei ist keine Sicherung des Fahrtkosten Planers"); }
  });
  document.querySelectorAll("[data-sicherung]").forEach((b) => b.addEventListener("click", () => { ui.bestaetigen = "sicherung-" + b.dataset.sicherung; render(); }));
  const sn = $("#sicherung-nein"); if (sn) sn.addEventListener("click", () => { ui.bestaetigen = ""; render(); });
  document.querySelectorAll("[data-sicherung-ja]").forEach((b) => b.addEventListener("click", async () => {
    const s = sicherungen()[+b.dataset.sicherungJa]; ui.bestaetigen = "";
    if (s) { await sicherungEinspielen(s, true); toast("Stand übernommen"); }
    render();
  }));
  const bw = $("#beispiel-weg"); if (bw) bw.addEventListener("click", async () => {
    for (const [id, d] of Object.entries(Store.docs)) if (d && d.beispiel) await Store.del(id);
    toast("Beispieldaten gelöscht"); render();
  });
  const al = $("#alles"); if (al) al.addEventListener("click", () => { ui.bestaetigen = "alles"; render(); });
  const an = $("#alles-nein"); if (an) an.addEventListener("click", () => { ui.bestaetigen = ""; render(); });
  const aj = $("#alles-ja"); if (aj) aj.addEventListener("click", async () => {
    for (const id of Object.keys(Store.docs)) await Store.del(id);
    ui.bestaetigen = ""; toast("Alle Daten gelöscht"); gehe("fahrten");
  });
}

function ibanGueltig(iban) {
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(iban)) return false;
  const umgestellt = (iban.slice(4) + iban.slice(0, 4)).replace(/[A-Z]/g, (c) => c.charCodeAt(0) - 55);
  let rest = 0; for (const z of umgestellt) rest = (rest * 10 + +z) % 97;
  return rest === 1;
}
