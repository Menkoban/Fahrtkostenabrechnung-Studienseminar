<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Fahrtkosten Vorbereitungsdienst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: eine schmale Spalte wie ein Fahrtenbuch, Navigation unten für den Daumen.
   Farben: Studienseminar Osnabrück BBS – Rot #e4013a, Anthrazit #373736, Hellgrau #f0f0ef, Bernstein #fcaf3b */
:root {
  --bg: #f0f0ef; --surface: #ffffff; --sunk: #e6e6e4; --ink: #232322; --muted: #5f5f61; --line: #d6d6d3;
  --accent: #e4013a; --accent-ink: #ffffff; --accent-soft: #fde5ea; --strong: #373736; --strong-ink: #ffffff; --amber: #fcaf3b;
  --warn: #7a4a00; --warn-bg: #feefd3; --bad: #a3102f; --bad-bg: #fbe3e7; --good: #1c6a3a; --good-bg: #e0f1e5;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px; --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1b1a; --surface: #262625; --sunk: #2f2f2d; --ink: #ededeb; --muted: #a8a8a5; --line: #3c3c3a;
  --accent: #ff5476; --accent-ink: #1b1b1a; --accent-soft: #42161f; --strong: #111110; --strong-ink: #ededeb; --amber: #fcaf3b;
  --warn: #f6c06a; --warn-bg: #3a2c10; --bad: #ff8fa3; --bad-bg: #3e1820; --good: #86d6a2; --good-bg: #16301f;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1b1b1a; --surface: #262625; --sunk: #2f2f2d; --ink: #ededeb; --muted: #a8a8a5; --line: #3c3c3a;
  --accent: #ff5476; --accent-ink: #1b1b1a; --accent-soft: #42161f; --strong: #111110; --strong-ink: #ededeb; --amber: #fcaf3b;
  --warn: #f6c06a; --warn-bg: #3a2c10; --bad: #ff8fa3; --bad-bg: #3e1820; --good: #86d6a2; --good-bg: #16301f;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* Fahrschein-Abriss: die offene Summe */
.stub { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid;
  grid-template-columns: 1fr auto; overflow: hidden; }
.stub > div { padding: 14px 16px; }
.stub .betrag { border-left: 2px dashed var(--line); text-align: right; background: var(--strong); color: var(--strong-ink); }
.stub .betrag .eyebrow { color: var(--strong-ink); opacity: .75; }
.stub .betrag .num { font-size: 1.6rem; color: var(--amber); display: block; }

/* Kopfband in Anthrazit mit rotem Block, angelehnt an die Seminarfarben */
.kopf { background: var(--strong); color: var(--strong-ink); padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.kopf .in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.kopf .marke { width: 14px; height: 28px; background: var(--accent); flex: none; }
.kopf b { font-family: var(--f-display); font-size: 1rem; letter-spacing: .01em; }
.kopf span { font-size: .8rem; opacity: .75; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--strong); }

.btn { font: inherit; font-weight: 700; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 10px 14px; cursor: pointer; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.ghost.danger { color: var(--bad); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.month { margin-top: 20px; }
.month h3 { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.item { display: grid; grid-template-columns: 4.2rem 1fr auto; gap: 12px; align-items: center; padding: 12px 14px;
  border-top: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; font: inherit; color: inherit;
  background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--sunk); }
.item .tag { font-family: var(--f-num); font-size: .85rem; line-height: 1.2; }
.item .tag b { display: block; font-family: var(--f-display); font-size: 1.15rem; }
.item .route { font-weight: 700; overflow-wrap: anywhere; }
.item .amount { text-align: right; }
.chip { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.chip.ok { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px 16px; margin: 0; min-width: 0; }
legend { font-family: var(--f-display); font-weight: 700; padding: 0 6px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: .875rem; color: var(--muted); font-weight: 700; min-width: 0; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 10px; min-height: 44px; width: 100%; font-weight: 400; }
textarea { min-height: 64px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.hint { font-size: .8rem; color: var(--muted); font-weight: 400; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-weight: 700; padding: 10px 6px; min-height: 44px; border: 0; background: var(--bg); color: var(--ink); cursor: pointer; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.route-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 44px; }
.stop { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--ink); border-radius: 99px; padding: 4px 4px 4px 12px; font-weight: 700; }
.stop button { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; width: 28px; height: 28px; border-radius: 99px; cursor: pointer; }
.arrow { color: var(--muted); }
.addstops { display: flex; flex-wrap: wrap; gap: 6px; }
.addstops button { font: inherit; border: 1px dashed var(--line); background: transparent; color: var(--ink); border-radius: 99px; padding: 6px 12px; cursor: pointer; min-height: 36px; }

.result { position: sticky; bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--accent);
  border-radius: var(--r); padding: 12px 14px; box-shadow: 0 6px 20px rgb(0 0 0 / .12); z-index: 2; }
@media (max-height: 900px) { .result { position: static; box-shadow: none; } }
.result .zahlen { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.result .summe { font-family: var(--f-num); font-size: 1.4rem; color: var(--accent); }
.tg-knopf { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; }
.tg-knopf::before { content: ""; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); flex: none; background: var(--bg); }
.tg-knopf[aria-pressed="true"] { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.tg-knopf[aria-pressed="true"]::before { content: "✓"; border-color: var(--good); background: var(--good); color: var(--surface); display: grid; place-items: center; font-size: 15px; }
.tagegeld { margin-top: 6px; font-size: .85rem; padding: 4px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); }
.tagegeld.ja { background: var(--good-bg); color: var(--good); font-weight: 700; }
.msgs { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: .875rem; }
.msgs li { padding: 4px 8px; border-radius: 6px; }
.msgs .bad { background: var(--bad-bg); color: var(--bad); }
.msgs .warn { background: var(--warn-bg); color: var(--warn); }

.banner { border-radius: var(--r); padding: 12px 14px; font-size: .9rem; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.good { background: var(--good-bg); color: var(--good); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.info { background: var(--accent-soft); }

.steps { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
table.dist { width: 100%; border-collapse: collapse; }
table.dist td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
table.dist td.km { width: 6.5rem; }
.check { flex-direction: row; align-items: center; gap: 10px; color: var(--ink); font-weight: 400; }
.check input { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }
.pick { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.pick:first-child { border-top: 0; }
.vorschau { display: flex; flex-direction: column; gap: 12px; }
.vorschau figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; }
.vorschau canvas { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--line); }
.vorschau figcaption { font-size: .8rem; color: var(--muted); font-weight: 700; padding: 6px 2px 0; }
.teile { display: flex; flex-direction: column; gap: 8px; }
.teil { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
nav.tabs button { font: inherit; font-weight: 700; font-size: .85rem; border: 0; background: none; color: var(--muted); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 4;
  border-radius: 99px; padding: 14px 20px; box-shadow: 0 6px 18px rgb(0 0 0 / .2); }
@media (min-width: 760px) { .fab { right: calc(50% - 360px + 16px); } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 80px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 9; max-width: calc(100% - 32px); font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: hoch .2s ease-out; } @keyframes hoch { from { transform: translate(-50%, 8px); opacity: 0; } } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
/* Rechenkern und PDF-Ausfüllung für die Fahrtkosten-App.
   Gleiche Regeln wie werkzeug/fahrtkosten.py (Leitfaden RLSB, Stand 01.01.2025).
   Läuft im Browser (global "Kern") und in Node (module.exports). */
(function (root) {
  "use strict";

  const SATZ_KLEIN = 0.25;        // € / km, § 5 Abs. 2 NRKVO
  const DECKEL_KLEIN = 125;       // € je Reise bei kleiner Wegstreckenentschädigung
  const SATZ_GROSS = 0.38;        // € / km, § 5 Abs. 3 (G1–G5 mit Begründung)
  const SATZ_FAHRRAD = 0.10;      // € / km, § 5 Abs. 5
  const TAGEGELD = 14;            // € bei Abwesenheit > 8 Stunden; mehrtägig: An- und Abreisetag
  const TAGEGELD_VOLL = 28;       // € je vollem Tag einer mehrtägigen Reise
  const KUERZUNG = { fruehstueck: 0.2, mittag: 0.4, abend: 0.4 };  // Anteil am vollen Tagegeld je gestellter Mahlzeit
  const UEBERNACHTUNG_PAUSCHAL = 20;  // € je Nacht ohne Beleg
  const UEBERNACHTUNG_GRENZE = 100;   // € je Nacht mit Beleg ohne Begründung
  const UEBERNACHTUNG_KOMPAKT = 50;   // € je Nacht, von der Seminarleitung genehmigungsfähig
  const FRIST_MONATE = 6;
  const ZEILEN_JE_ANLAGE = 15;

  const GRUENDE = {
    G1: "Dienstgeschäft mit regelmäßigen Beförderungsmitteln nicht durchführbar",
    G2: "Verknüpfung mehrerer Dienstgeschäfte am selben Tag (eigener Unterricht zählt)",
    G3: "Schweres (ab 25 kg) oder sperriges Dienstgepäck",
    G4: "Kostengünstiger, z. B. Fahrgemeinschaft",
    G5: "Schwerbehinderung mit Merkzeichen aG",
  };

  // Ankreuzfelder im Antrag 035_002 (per Position im Formular zugeordnet)
  const BAHNCARD_FELD = { nein: "OBJ21", business25: "OBJ23", business50: "OBJ24",
    business100: "OBJ25", "25": "OBJ26", "50": "OBJ27", "100": "OBJ28" };
  const IMMER_NEIN = ["OBJ34", "OBJ38", "OBJ40", "OBJ42", "OBJ9", "OBJ52", "OBJ54"];

  // ------------------------------------------------------------ Hilfen

  function isoHeute() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function teile(iso) {
    const [j, m, t] = iso.split("-").map(Number);
    return { j, m, t };
  }

  function deDatum(iso, kurz) {
    const { j, m, t } = teile(iso);
    const jj = kurz ? String(j).slice(2) : j;
    return `${String(t).padStart(2, "0")}.${String(m).padStart(2, "0")}.${jj}`;
  }

  function fristEnde(iso) {
    const { j, m, t } = teile(iso);
    const mon = m - 1 + FRIST_MONATE;
    const jahr = j + Math.floor(mon / 12), monat = (mon % 12) + 1;
    const letzter = new Date(Date.UTC(jahr, monat, 0)).getUTCDate();
    return `${jahr}-${String(monat).padStart(2, "0")}-${String(Math.min(t, letzter)).padStart(2, "0")}`;
  }

  function tageZwischen(isoA, isoB) {
    const a = teile(isoA), b = teile(isoB);
    return Math.round((Date.UTC(b.j, b.m - 1, b.t) - Date.UTC(a.j, a.m - 1, a.t)) / 86400000);
  }

  function stunden(von, bis) {
    if (!von || !bis) return 0;
    const [h0, m0] = von.split(":").map(Number), [h1, m1] = bis.split(":").map(Number);
    let d = (h1 * 60 + m1) - (h0 * 60 + m0);
    if (d < 0) d += 24 * 60;
    return d / 60;
  }

  function eur(x) {
    return (Math.round(x * 100) / 100).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  function km(x) {
    return String(Math.round(x * 10) / 10).replace(".", ",");
  }

  // ------------------------------------------------------------ Regeln

  function ortMap(orte) {
    const m = {};
    for (const o of orte.orte || []) m[o.name] = o;
    return m;
  }

  function entfernung(orte, a, b) {
    for (const e of orte.entfernungen || []) {
      if ((e.a === a && e.b === b) || (e.a === b && e.b === a)) {
        const wert = Number(e.km);
        return wert > 0 ? wert : null;
      }
    }
    return null;
  }

  function istArbeitsweg(typA, typB) {
    return (typA === "wohnung" && typB === "ausbildungsschule") || (typA === "ausbildungsschule" && typB === "wohnung");
  }

  function ortsbezeichnung(o) {
    return { wohnung: "Wohnort", ausbildungsschule: "Dienstort" }[o.typ] || o.name;
  }

  function istMehrtaegig(f) {
    return !!(f.datum && f.datumBis && f.datumBis > f.datum);
  }

  function mahlzeitenText(f) {
    const m = f.mahlzeiten || {};
    const teile = [["fruehstueck", "Frühstück"], ["mittag", "Mittagessen"], ["abend", "Abendessen"]]
      .filter(([k]) => Number(m[k]) > 0).map(([k, l]) => `${m[k]}× ${l}`);
    if (f.uebernachtung === "gestellt") teile.push(`${tageZwischen(f.datum, f.datumBis)}× Unterkunft`);
    return teile.join(", ");
  }

  /**
   * Nr. 2.1.5 VV-NRKVO: Eine Reise gilt als an der Dienststätte (Ausbildungsschule) angetreten bzw. beendet,
   * wenn sie dort innerhalb der Arbeitszeit hätte beginnen können – außer der Start an der Wohnung ist wirtschaftlicher.
   * Nur aktiv, wenn in den Einstellungen „kürzere Strecke“ gewählt ist (orte.streckeAb = "kuerzer").
   * Ausnahme: Fahrten in der Einführungswoche (f.einfuehrung) – dann gibt es noch keinen Dienst an der Schule.
   */
  function vergleicheMitDienststaette(f, orte, katalog, route, r) {
    if (orte.streckeAb !== "kuerzer" || istMehrtaegig(f) || f.einfuehrung) return;
    const schule = (orte.orte || []).find((o) => o.typ === "ausbildungsschule");
    if (!schule || katalog[route[0]].typ !== "wohnung") return;
    // Nur Tage ohne Unterricht: wer vorher unterrichtet, startet ohnehin an der Schule
    if (f.unterrichtBis || f.unterrichtVon || route.some((s) => katalog[s].typ === "ausbildungsschule")) return;
    const letzte = route.length - 1;
    const alt = route.map((s, i) => ((i === 0 || i === letzte) && katalog[s].typ === "wohnung" ? schule.name : s));
    let altKm = 0;
    for (let i = 0; i < alt.length - 1; i++) {
      const a = katalog[alt[i]], b = katalog[alt[i + 1]];
      if (a.name === b.name || istArbeitsweg(a.typ, b.typ)) continue;
      const d = entfernung(orte, a.name, b.name);
      if (d === null) {
        r.hinweise.push(`Für den Vergleich ab Ausbildungsschule fehlt die Entfernung ${a.name} – ${b.name}`);
        return;
      }
      altKm += d;
    }
    if (altKm < r.km) {
      r.kmWohnung = r.km;
      r.km = altKm;
      r.abSchule = true;
      r.beginnIn = "Dienstort";
      if (katalog[route[letzte]].typ === "wohnung") r.endeIn = "Dienstort";
      r.hinweise.push(`Ab Ausbildungsschule gerechnet (Nr. 2.1.5 VV-NRKVO): ${km(altKm)} statt ${km(r.kmWohnung)} km. In der Einführungswoche bitte „Einführungswoche“ ankreuzen.`);
    }
  }

  /** Berechnet eine Fahrt. Liefert ein neues Objekt mit Ergebnis, Fehlern und Hinweisen. */
  function berechne(f, orte, heute) {
    heute = heute || isoHeute();
    const r = { km: 0, satz: 0, wegstrecke: 0, gedeckelt: false, beginnIn: "", endeIn: "",
      dienstgeschaeftIn: "", tagegeld: 0, summe: 0, fehler: [], hinweise: [], fristEnde: "", fehlendeStrecken: [],
      mehrtaegig: false, tage: 1, naechte: 0, tageAnAb: 0, tageVoll: 0, kuerzung: 0, uebernachtungsgeld: 0, uebernachtungskosten: 0,
      abwesenheit: 0, tagegeldText: "", tagegeldGewaehlt: false, tagegeldAutomatisch: false, rueckwegFehlt: false };
    const katalog = ortMap(orte);
    const route = f.route || [];
    const ende = f.datumBis && f.datumBis > f.datum ? f.datumBis : f.datum;

    if (!f.datum) r.fehler.push("Datum fehlt");
    if (f.datumBis && f.datum && f.datumBis < f.datum) r.fehler.push("Das Enddatum liegt vor dem Startdatum");
    if (route.length < 2) r.fehler.push("Route braucht mindestens zwei Stationen");
    for (const s of route) if (!katalog[s]) r.fehler.push(`Ort „${s}“ gibt es nicht mehr`);
    if (r.fehler.length) return r;

    const gezaehlt = [];
    for (let i = 0; i < route.length - 1; i++) {
      const a = katalog[route[i]], b = katalog[route[i + 1]];
      if (a.name === b.name || istArbeitsweg(a.typ, b.typ)) continue;
      const d = entfernung(orte, a.name, b.name);
      if (d === null) {
        r.fehlendeStrecken.push([a.name, b.name]);
        r.fehler.push(`Entfernung ${a.name} – ${b.name} fehlt (Einstellungen)`);
      } else {
        gezaehlt.push([a, b, d]);
      }
    }
    if (r.fehler.length) return r;
    if (!gezaehlt.length) {
      r.fehler.push("Nicht erstattungsfähig: Wohnung ↔ Ausbildungsschule ist der normale Arbeitsweg");
      return r;
    }

    r.km = gezaehlt.reduce((s, g) => s + g[2], 0);
    r.beginnIn = ortsbezeichnung(gezaehlt[0][0]);
    r.endeIn = ortsbezeichnung(gezaehlt[gezaehlt.length - 1][1]);
    vergleicheMitDienststaette(f, orte, katalog, route, r);
    const ziele = [...new Set(route)].map((s) => katalog[s]).filter((o) => o.typ !== "wohnung" && o.typ !== "ausbildungsschule");
    r.dienstgeschaeftIn = ziele.map((o) => o.adresse || o.name).join(" / ");
    // Endet die Route nicht wieder zu Hause bzw. an der Schule, fehlt meist die Rückfahrt – und mit ihr die Hälfte der km
    const letzter = katalog[route[route.length - 1]];
    if (letzter.typ !== "wohnung" && letzter.typ !== "ausbildungsschule") {
      r.rueckwegFehlt = true;
      r.hinweise.push(`Die Route endet in „${letzter.name}“. Fehlt die Rückfahrt? Sonst zählen nur die km der Hinfahrt.`);
    }

    for (const [feld, name] of [["abfahrt", "Abfahrt"], ["ankunft", "Ankunft"],
      ["veranstVon", "Beginn der Veranstaltung"], ["veranstBis", "Ende der Veranstaltung"]]) {
      if (!f[feld]) r.fehler.push(`${name} fehlt`);
    }
    if (f.anlass === "d" && !(f.anlassText || "").trim()) r.fehler.push("Sonstiger Anlass braucht eine Beschreibung");
    if (f.grund) {
      if (f.verkehrsmittel !== "pkw") r.fehler.push("G1–G5 gilt nur für den privaten Pkw");
      if (!(f.begruendung || "").trim()) r.fehler.push(`${f.grund} ohne Begründung wird abgelehnt`);
    }
    if (ende > heute) r.fehler.push(ende === f.datum ? "Datum liegt in der Zukunft" : "Die Reise ist noch nicht beendet");

    r.fristEnde = fristEnde(ende);
    if (heute > r.fristEnde) r.fehler.push(`Frist abgelaufen (endete ${deDatum(r.fristEnde)})`);
    else if (tageZwischen(heute, r.fristEnde) <= 30) r.hinweise.push(`Frist endet am ${deDatum(r.fristEnde)}`);

    if (f.verkehrsmittel === "pkw") {
      r.satz = f.grund ? SATZ_GROSS : SATZ_KLEIN;
      r.wegstrecke = Math.round(r.km * r.satz * 100) / 100;
      if (!f.grund && r.wegstrecke > DECKEL_KLEIN) {
        r.wegstrecke = DECKEL_KLEIN;
        r.gedeckelt = true;
        r.hinweise.push("Auf 125 € je Reise gedeckelt");
      }
      if (!f.grund && (f.mitfahrende || "").trim()) r.hinweise.push("Fahrgemeinschaft: mit G4 gibt es 0,38 €/km");
      else if (!f.grund && f.unterrichtBis && f.veranstVon) r.hinweise.push("Unterricht und Seminar am selben Tag: G2 prüfen");
    } else if (f.verkehrsmittel === "mitfahrt") {
      // Mitfahrt in einer Fahrgemeinschaft: keine Fahrtkosten, Tagegeld bleibt
      if (!(f.fahrer || "").trim()) r.fehler.push("Bei Mitfahrt bitte angeben, wer gefahren ist");
    } else if (f.verkehrsmittel === "fahrrad") {
      r.satz = SATZ_FAHRRAD;
      r.wegstrecke = Math.round(r.km * r.satz * 100) / 100;
    } else if (f.verkehrsmittel === "oepnv" && !f.fahrkarte) {
      r.hinweise.push("ÖPNV ohne Fahrpreis: nur richtig mit Abo oder Deutschlandticket");
    }
    if (f.fahrkarte || f.sonstige) r.hinweise.push("Beleg beifügen");

    if (istMehrtaegig(f)) {
      r.mehrtaegig = true;
      r.tage = tageZwischen(f.datum, f.datumBis) + 1;
      r.naechte = r.tage - 1;
      r.tageAnAb = 2;
      r.tageVoll = r.tage - 2;
      const m = f.mahlzeiten || {};
      const kuerzung = Object.entries(KUERZUNG).reduce((s, [k, anteil]) => s + (Number(m[k]) || 0) * anteil * TAGEGELD_VOLL, 0);
      const brutto = r.tageAnAb * TAGEGELD + r.tageVoll * TAGEGELD_VOLL;
      r.kuerzung = Math.min(brutto, Math.round(kuerzung * 100) / 100);
      r.tagegeld = brutto - r.kuerzung;

      const art = f.uebernachtung || "pauschal";
      if (art === "pauschal") {
        r.uebernachtungsgeld = UEBERNACHTUNG_PAUSCHAL * r.naechte;
      } else if (art === "beleg") {
        r.uebernachtungskosten = Number(f.uebernachtungKosten) || 0;
        const jeNacht = r.uebernachtungskosten / r.naechte;
        if (!r.uebernachtungskosten) r.fehler.push("Hotelkosten fehlen (oder Pauschale wählen)");
        else r.hinweise.push("Hotelrechnung beifügen");
        if (jeNacht > UEBERNACHTUNG_GRENZE && !(f.uebernachtungBegruendung || "").trim()) {
          r.fehler.push(`Über ${UEBERNACHTUNG_GRENZE} € je Nacht: Begründung mit Nachweis der Suche nach günstigeren Unterkünften nötig`);
        }
        if (f.kompakt && jeNacht > UEBERNACHTUNG_KOMPAKT) {
          r.hinweise.push(`Kompaktveranstaltung: Die Seminarleitung genehmigt bis ${UEBERNACHTUNG_KOMPAKT} € je Nacht, mehr nur das RLSB`);
        }
      }
      if (!(f.genehmigung || "").trim()) r.hinweise.push("Mehrtägige Reisen vorher genehmigen lassen (Seminarleitung) und Genehmigung eintragen");
      if (f.kompakt && route.some((s) => katalog[s] && katalog[s].typ === "sonstiges")) {
        r.hinweise.push("Kompaktveranstaltungen werden nur innerhalb des RLSB-Bezirks erstattet");
      }
      r.tagegeldText = `Tagegeld ${r.tageAnAb} × ${eur(TAGEGELD)} €${r.tageVoll ? ` + ${r.tageVoll} × ${eur(TAGEGELD_VOLL)} €` : ""}`
        + (r.kuerzung ? `, abzüglich ${eur(r.kuerzung)} € für gestellte Mahlzeiten` : "");
    } else {
      // Eintägig: maßgeblich ist die Dauer der Dienstreise von der Abfahrt (Hinfahrt) bis zur Rückkehr (Rückfahrt).
      // Beginnt sie an der Ausbildungsschule, zählt die Zeit dort nicht mit (Dienststätte, § 2 NRKVO).
      // Mit f.tagegeldWahl = "ja" / "nein" lässt sich die Automatik per Knopf überstimmen.
      let dauer = "";
      if (f.abfahrt && f.ankunft) {
        r.abwesenheit = stunden(f.abfahrt, f.ankunft);
        const minuten = Math.round(r.abwesenheit * 60);
        dauer = `${f.abfahrt}–${f.ankunft} Uhr = ${Math.floor(minuten / 60)}:${String(minuten % 60).padStart(2, "0")} Std. unterwegs`;
      }
      const automatisch = r.abwesenheit > 8;
      const wahl = f.tagegeldWahl === "ja" || f.tagegeldWahl === "nein" ? f.tagegeldWahl : (automatisch ? "ja" : "nein");
      r.tagegeldGewaehlt = wahl === "ja";
      r.tagegeldAutomatisch = automatisch;
      if (wahl === "ja") {
        r.tagegeld = TAGEGELD;
        r.tagegeldText = `${dauer ? dauer + ": " : ""}Tagegeld ${eur(TAGEGELD)} €`;
        if (!automatisch) {
          r.hinweise.push(dauer
            ? "Tagegeld gibt es nur bei mehr als 8 Std. Bitte Abfahrt (Hinfahrt) und Rückkehr (Rückfahrt) prüfen."
            : "Für das Tagegeld bitte Abfahrt und Rückkehr eintragen.");
        }
      } else {
        const ab = r.beginnIn === "Dienstort" && !r.abSchule ? " ab der Ausbildungsschule" : "";
        r.tagegeldText = f.tagegeldWahl === "nein" ? "Tagegeld abgewählt"
          : `${dauer ? dauer + ab + ": " : ""}kein Tagegeld (erst ab mehr als 8 Std.)`;
      }
    }
    r.summe = r.wegstrecke + (Number(f.fahrkarte) || 0) + (Number(f.sonstige) || 0) + r.tagegeld
      + r.uebernachtungsgeld + r.uebernachtungskosten;
    return r;
  }

  function g4Vorschlag(f) {
    const namen = (f.mitfahrende || "").trim();
    return namen ? `Fahrgemeinschaft mit ${namen} (ebenfalls Landesbedienstete), dadurch kostengünstiger als Einzelfahrten` : "";
  }

  function g2Vorschlag(f) {
    const teile = [];
    if (f.unterrichtBis) teile.push(`Unterricht bis ${f.unterrichtBis}`);
    if (f.veranstVon) teile.push(`Seminar ab ${f.veranstVon}`);
    return teile.length ? `${teile.join(", ")}; mit ÖPNV nicht rechtzeitig erreichbar` : "";
  }

  // ------------------------------------------------------------ Formularwerte

  function werteAnlage(profil, fahrten) {
    const name = profil.name + (profil.amtsbezeichnung ? ` (${profil.amtsbezeichnung})` : "");
    const w = { Name_Antragsteller: name, Name_Schule: profil.schule_name_adresse, Adresse_Antragsteller: profil.wohnanschrift };
    let summe = 0;
    fahrten.forEach(({ f, r }, i) => {
      const n = i === 0 ? "" : String(i);
      const zaehlt = f.verkehrsmittel === "pkw" || f.verkehrsmittel === "fahrrad";
      if (zaehlt) summe += r.km;
      const mitfahrende = (f.mitfahrende || "").trim();
      const begruendung = f.verkehrsmittel === "mitfahrt" ? `Mitfahrt bei ${(f.fahrer || "").trim()}, keine Fahrtkosten`
        : [f.begruendung || "", mitfahrende && !(f.begruendung || "").includes(mitfahrende) ? `Mitfahrende: ${mitfahrende}` : ""].filter(Boolean).join("; ");
      Object.assign(w, {
        [`Datum${n}`]: deDatum(f.datum, true),
        [`von_Uhrzeit${n}`]: f.unterrichtVon || "",
        [`bis_Uhrzeit${i + 1}`]: f.unterrichtBis || "",
        [`Beginn_der_Fahrt_Wohnort${n}`]: r.beginnIn,
        [`Beginn_der_Fahrt_Uhrzeit${n}`]: f.abfahrt,
        [`Anlass_DR${n}`]: f.anlass || "a",
        [`Seminarveranstaltung_in_Ort${n}`]: f.anlass === "d" ? `${f.anlassText}: ${r.dienstgeschaeftIn}` : r.dienstgeschaeftIn,
        [`Seminar_von_Uhrzeit${n}`]: f.veranstVon,
        [`Seminar_bis_Uhrzeit${n}`]: f.veranstBis,
        [`Ende_der_Fahrt_Wohnort${n}`]: r.endeIn,
        [`Ende_der_Fahrt_Uhrzeit${n}`]: f.ankunft,
        [`Strecke${n}`]: zaehlt ? km(r.km) : "",
        [`Nutzung_Befoerderungsmittel${n}`]: f.verkehrsmittel === "fahrrad",
        [`Grund_Nutzung_Pkw${n}`]: f.grund || "",
        [`Begruendung${n}`]: begruendung,
        [`Oepnv_Parken${n}`]: !!(f.fahrkarte || f.sonstige),
      });
    });
    w.Summe_Strecke = km(summe);
    return w;
  }

  function datenText(fahrten) {
    const jahre = [...new Set(fahrten.map(({ f }) => f.datum.slice(0, 4)))].sort();
    return jahre.map((j) => fahrten.filter(({ f }) => f.datum.startsWith(j))
      .map(({ f }) => deDatum(f.datum).slice(0, 6)).join(", ") + j).join("; ");
  }

  /** Erläuterungen zu Fahrgemeinschaften: Namen der Mitfahrenden bzw. wer gefahren ist (verlangt das Formular). */
  function fahrgemeinschaftText(fahrten) {
    const text = [];
    const gefahren = fahrten.filter(({ f }) => f.verkehrsmittel === "pkw" && (f.mitfahrende || "").trim());
    if (gefahren.length) {
      text.push("Fahrgemeinschaft, mitfahrende Personen: " + gefahren.map(({ f }) => `${deDatum(f.datum).slice(0, 6)} ${f.mitfahrende.trim()}`).join("; ") + ".");
    }
    const mit = fahrten.filter(({ f }) => f.verkehrsmittel === "mitfahrt");
    if (mit.length) {
      text.push("Mitfahrt in Fahrgemeinschaft ohne Fahrtkosten: " + mit.map(({ f }) => `${deDatum(f.datum).slice(0, 6)} bei ${(f.fahrer || "").trim()}`).join("; ") + ".");
    }
    return text;
  }

  /** Felder, die jeder Antrag hat: Person, Bank, Allgemeines, Beförderungsmittel, Fahrtkosten, Wegstrecke. */
  function basisAntrag(profil, fahrten) {
    const iban = (profil.iban || "").replace(/\s/g, "").toUpperCase();
    const w = {
      Beschaeftigungsstelle: profil.beschaeftigungsstelle,
      Name__Vorname: profil.name,
      Kreditinstitut: profil.bic,
      Abrechnende_Dienststelle: profil.abrechnende_dienststelle,
      Wohnungsanschrift: [profil.wohnanschrift, profil.telefon, profil.email].filter(Boolean).join("\n"),
    };
    [...iban.slice(0, 22)].forEach((z, i) => { w[`IBAN${i + 1}`] = z; });

    const bahncard = String(profil.bahncard || "nein").toLowerCase().replace(/\s/g, "");
    w[BAHNCARD_FELD[bahncard] || "OBJ21"] = true;
    if (bahncard !== "nein") w.OBJ22 = true;
    if (profil.geschaeftskundenrabatt) w.OBJ29 = true;
    else { w.OBJ30 = true; w.Begruendung_nein = profil.begruendung_kein_geschaeftskundenrabatt || ""; }
    if (profil.ermaessigungskarte) { w.OBJ33 = true; w.Strecke = profil.ermaessigungskarte; } else w.OBJ32 = true;
    for (const feld of IMMER_NEIN) w[feld] = true;
    w.OBJ37 = true;  // keine unentgeltliche Verpflegung; mehrtägige Reisen überschreiben das

    const mittel = new Set(fahrten.map(({ f }) => f.verkehrsmittel));
    if (mittel.has("oepnv")) w.OBJ4 = true;
    if (fahrten.some(({ f }) => f.verkehrsmittel === "pkw" && !f.grund)) w.OBJ6 = true;
    if (fahrten.some(({ f }) => f.verkehrsmittel === "pkw" && f.grund)) w.OBJ7 = true;
    if (mittel.has("fahrrad")) w.OBJ8 = true;

    const fahrkarte = fahrten.reduce((s, { f }) => s + (Number(f.fahrkarte) || 0), 0);
    const sonstige = fahrten.reduce((s, { f }) => s + (Number(f.sonstige) || 0), 0);
    if (fahrkarte) w.Fahrkarte = eur(fahrkarte);
    if (sonstige) w.Sonstige_Fahrauslagen = eur(sonstige);

    const gruppen = new Map();
    for (const { r } of fahrten) {
      if (!r.satz) continue;
      const g = gruppen.get(r.satz) || [0, 0];
      gruppen.set(r.satz, [g[0] + r.km, g[1] + r.wegstrecke]);
    }
    if (gruppen.size > 2) {
      // Das Formular hat nur zwei km-Zeilen: Das Fahrrad wandert dann in „Erstattung sonstiger Kosten“ (Seite 2)
      const [k, betrag] = gruppen.get(SATZ_FAHRRAD);
      gruppen.delete(SATZ_FAHRRAD);
      w.Sonstige_Fahrauslagen1 = eur(betrag);
      w.Erlaeuterungen1 = `Wegstreckenentschädigung Fahrrad (§ 5 Abs. 5 NRKVO): ${km(k)} km × ${eur(SATZ_FAHRRAD)} € = ${eur(betrag)} €, Fahrten siehe Anlage 035_016 (Spalte 8).`;
    }
    const zeilen = [["Tage3", "EUR3", "Wegstreckenentschaedigung"], ["Tage4", "EUR4", "Wegstreckenentschaedigung1"]];
    [SATZ_KLEIN, SATZ_GROSS, SATZ_FAHRRAD].filter((s) => gruppen.has(s)).forEach((satz, i) => {
      const [k, betrag] = gruppen.get(satz);
      const [fk, fs, fe] = zeilen[i];
      w[fk] = km(k); w[fs] = eur(satz); w[fe] = eur(betrag);
    });
    return { w, mittel, belege: !!(fahrkarte || sonstige) };
  }

  /** Sammelantrag für Tagesfahrten; Einzelheiten stehen in der Anlage 035_016. */
  function werteAntrag(profil, fahrten, blaetter) {
    const { w, mittel, belege } = basisAntrag(profil, fahrten);
    const daten = datenText(fahrten);
    const grund = `AFR, Ausbildungsfahrten lt. Anlage 035_016: ${daten}`;
    if (grund.length <= 75) w.Grund_der_RKR = grund;
    else { w.Grund_der_RKR = "AFR, Ausbildungsfahrten lt. Anlage 035_016 (Daten s. Anlage)"; w.Grund_der_RKR1 = daten; }

    const siehe = "siehe Anlage 035_016";
    Object.assign(w, { Beginn_der_Dienstreise: siehe, Beginn_des_Dienstgeschaefts: siehe,
      Ende_des_Dienstgeschaefts: siehe, Ende_der_Dienstreise: siehe,
      Reiseziel_Reiseweg: `${siehe} (${fahrten.length} Fahrten, ${blaetter} Blatt)` });

    const tage = fahrten.filter(({ r }) => r.tagegeld).length;
    if (tage) { w.Tage = String(tage); w.EUR = eur(TAGEGELD); }

    const text = ["Reisen zum Zweck der Ausbildung (generell genehmigt, Anlage 1 Leitfaden Genehmigung von Dienstreisen).",
      `Einzelaufstellung siehe Anlage 035_016 (${blaetter} Blatt).`];
    if (w.OBJ7) text.push("Erhebliches dienstliches Interesse an der Pkw-Nutzung (§ 5 Abs. 3 NRKVO): Gründe G1–G5 mit Begründung je Fahrt in der Anlage.");
    if (fahrten.some(({ r }) => r.gedeckelt)) text.push("Kleine Wegstreckenentschädigung je Reise auf 125 € begrenzt.");
    if (mittel.has("fahrrad")) text.push("Fahrrad: Wegstreckenentschädigung nach § 5 Abs. 5 NRKVO.");
    text.push(...fahrgemeinschaftText(fahrten));
    if (fahrten.some(({ r }) => r.abSchule)) text.push("Strecken an Tagen ohne Unterricht nach Nr. 2.1.5 VV-NRKVO ab Ausbildungsschule berechnet, soweit kürzer.");
    const einf = fahrten.filter(({ f }) => f.einfuehrung);
    if (einf.length) text.push(`Einführungswoche (${einf.map(({ f }) => deDatum(f.datum).slice(0, 6)).join(", ")}): noch kein Dienst an der Ausbildungsschule, Fahrten ab Wohnung.`);
    if (belege) text.push("Belege (Fahrkarten/Parkscheine) liegen bei.");
    w.Erlaeuterungen = text.join(" ");
    return w;
  }

  /** Eigener Antrag für eine mehrtägige Reise (z. B. Kompaktseminar): Zeiten, Tagegeld und Übernachtung direkt im Antrag. */
  function werteAntragMehrtaegig(profil, { f, r }) {
    const { w, belege } = basisAntrag(profil, [{ f, r }]);
    const anlass = f.anlass === "d" ? f.anlassText : (f.kompakt ? "Kompaktseminar" : "Seminarveranstaltung");
    w.Grund_der_RKR = `AFR, ${anlass}, ${deDatum(f.datum).slice(0, 6)}–${deDatum(f.datumBis)}`;
    if ((f.genehmigung || "").trim()) { w.OBJ3 = true; w.Dienststelle_Datum = f.genehmigung.trim(); }
    Object.assign(w, {
      Beginn_der_Dienstreise: `${deDatum(f.datum)}, ${f.abfahrt} Uhr`,
      Beginn_des_Dienstgeschaefts: `${deDatum(f.datum)}, ${f.veranstVon} Uhr`,
      Ende_des_Dienstgeschaefts: `${deDatum(f.datumBis)}, ${f.veranstBis} Uhr`,
      Ende_der_Dienstreise: `${deDatum(f.datumBis)}, ${f.ankunft} Uhr`,
      Reiseziel_Reiseweg: `${r.dienstgeschaeftIn} (${(f.route || []).join(" – ")})`,
    });

    // Tagegeld ungekürzt eintragen; Kürzungen für gestellte Mahlzeiten setzt das RLSB in den roten Feldern ab
    w.Tage = String(r.tageAnAb); w.EUR = eur(TAGEGELD);
    if (r.tageVoll) { w.Tage6 = String(r.tageVoll); w.EUR6 = eur(TAGEGELD_VOLL); }
    const mahlzeiten = mahlzeitenText(f);
    if (mahlzeiten) { delete w.OBJ37; w.OBJ36 = true; w.Verpflegung = mahlzeiten; }
    if (r.uebernachtungsgeld) w.Uebernachtungsgeld = eur(r.uebernachtungsgeld);
    if (r.uebernachtungskosten) w.Erstattung_Uebernachtungskosten = eur(r.uebernachtungskosten);

    const text = [`Mehrtägige Reise zum Zweck der Ausbildung (${anlass}), ${r.tage} Tage, ${r.naechte} Übernachtung${r.naechte === 1 ? "" : "en"}.`];
    if (f.kompakt) text.push("Kompaktveranstaltung des Studienseminars.");
    if (f.verkehrsmittel !== "oepnv") text.push(`Strecke ${km(r.km)} km.`);
    if (f.grund) text.push(`Pkw-Nutzung ${f.grund}: ${f.begruendung}`);
    text.push(...fahrgemeinschaftText([{ f, r }]));
    if (f.uebernachtung === "beleg") text.push(`Übernachtungskosten lt. Rechnung${(f.uebernachtungBegruendung || "").trim() ? `: ${f.uebernachtungBegruendung.trim()}` : "."}`);
    if (f.uebernachtung === "gestellt") text.push("Unterkunft wurde unentgeltlich gestellt.");
    if (belege || r.uebernachtungskosten) text.push("Belege liegen bei.");
    w.Erlaeuterungen = text.join(" ");
    return w;
  }

  // ------------------------------------------------------------ PDF

  // Verständliche Namen für Hinweise zu gekürzten oder sehr klein gesetzten Feldern
  const FELDNAMEN = {
    Begruendung_nein: "Begründung ohne Geschäftskundenrabatt", Strecke: "Ermäßigungskarte", Beschaeftigungsstelle: "Beschäftigungsstelle",
    Name__Vorname: "Name", Abrechnende_Dienststelle: "Abrechnende Dienststelle", Reiseziel_Reiseweg: "Reiseziel/Reiseweg",
    Verpflegung: "Gestellte Mahlzeiten", Dienststelle_Datum: "Genehmigt durch", Grund_der_RKR: "Grund der Reise",
    Name_Schule: "Schulname und Adresse", Adresse_Antragsteller: "Wohnanschrift", Seminarveranstaltung_in_Ort: "Ort der Veranstaltung",
    Begruendung: "Begründung G1–G5", Erlaeuterungen: "Erläuterungen", Wohnungsanschrift: "Wohnanschrift",
  };

  function machSicher(font, text) {
    // Standard-Helvetica kann nur WinAnsi; alles andere ersetzen statt abzustürzen
    let aus = "";
    for (const z of text.replace(/[↔→]/g, "-").replace(/[„“]/g, '"')) {
      if (z === "\n") { aus += z; continue; }
      try { font.widthOfTextAtSize(z, 8); aus += z; } catch (e) { aus += "?"; }
    }
    return aus;
  }

  function umbrechen(font, text, groesse, breite) {
    const zeilen = [];
    for (const absatz of text.split("\n")) {
      let zeile = "";
      for (const wort of absatz.split(/\s+/).filter(Boolean)) {
        const probe = zeile ? `${zeile} ${wort}` : wort;
        if (zeile && font.widthOfTextAtSize(probe, groesse) > breite) { zeilen.push(zeile); zeile = wort; }
        else zeile = probe;
      }
      zeilen.push(zeile);
    }
    return zeilen;
  }

  function passendeSchrift(font, text, rect) {
    const breite = rect.width - (rect.width < 15 ? 1 : 6), hoehe = rect.height - 2;
    const mehrzeilig = hoehe >= 15;
    for (const g of [8, 7, 6.5, 6, 5.5, 5, 4.5, 4]) {
      if (!mehrzeilig) {
        if (g <= hoehe * 0.85 && font.widthOfTextAtSize(text, g) <= breite) return { g, mehrzeilig, passt: true };
      } else if (umbrechen(font, text, g, breite).length * g * 1.4 <= hoehe) {
        return { g, mehrzeilig, passt: true };
      }
    }
    return { g: 4, mehrzeilig, passt: false };
  }

  async function fuelle(PDFLib, bytes, werte, etikett, zuLang) {
    const doc = await PDFLib.PDFDocument.load(bytes);
    const form = doc.getForm();
    const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    for (const [name, wert] of Object.entries(werte)) {
      const feld = form.getField(name);
      if (feld instanceof PDFLib.PDFCheckBox) {
        if (wert) feld.check();
        continue;
      }
      let text = machSicher(font, String(wert ?? ""));
      if (!text) continue;
      // Viele Formularfelder erlauben höchstens 199 Zeichen: an einer Wortgrenze kürzen statt abzubrechen
      const max = feld.getMaxLength();
      if (max !== undefined && text.length > max) {
        const schnitt = text.slice(0, max - 1);
        text = (schnitt.lastIndexOf(" ") > max * 0.6 ? schnitt.slice(0, schnitt.lastIndexOf(" ")) : schnitt) + "…";
        zuLang.push(`${etikett}: ${FELDNAMEN[name.replace(/\d+$/, "")] || name} auf ${max} Zeichen gekürzt`);
      }
      const rect = feld.acroField.getWidgets()[0].getRectangle();
      const { g, mehrzeilig, passt } = passendeSchrift(font, text, rect);
      if (!passt) zuLang.push(`${etikett}: ${FELDNAMEN[name.replace(/\d+$/, "")] || name} steht in sehr kleiner Schrift`);
      if (mehrzeilig) feld.enableMultiline();
      feld.setText(text);
      feld.setFontSize(g);
    }
    // Verstecktes Systemfeld des Formularservers, wird beim Einbrennen sonst als grauer Balken sichtbar
    const dummy = form.getFieldMaybe("SYSTEM_P1_DUMMY");
    if (dummy) {
      for (const w of dummy.acroField.getWidgets()) {
        const ref = doc.context.getObjectRef(w.dict);
        if (ref) for (const seite of doc.getPages()) seite.node.removeAnnot(ref);
      }
      form.acroForm.removeField(dummy.acroField);
    }
    form.updateFieldAppearances(font);
    form.flatten();
    return doc;
  }

  async function zusammenfuegen(PDFLib, docs) {
    const ziel = await PDFLib.PDFDocument.create();
    for (const d of docs) {
      const seiten = await ziel.copyPages(d, d.getPageIndices());
      seiten.forEach((s) => ziel.addPage(s));
    }
    return ziel.save();
  }

  /**
   * Erzeugt die Abrechnung als flache PDFs. fahrten: [{f, r}] ohne Fehler.
   * Tagesfahrten: ein Antrag 035_002 + Anlage(n) 035_016. Jede mehrtägige Reise: ein eigener Antrag.
   * Liefert die Gesamtdatei und jedes Teil einzeln (zum getrennten Speichern und für die Vorschau).
   */
  async function erzeugePdf(PDFLib, { profil, fahrten, antragBytes, anlageBytes }) {
    const sortiert = [...fahrten].sort((x, y) => (x.f.datum + x.f.abfahrt).localeCompare(y.f.datum + y.f.abfahrt));
    const tagesfahrten = sortiert.filter(({ r }) => !r.mehrtaegig);
    const mehrtaegig = sortiert.filter(({ r }) => r.mehrtaegig);
    const zuLang = [];
    const teile = [];  // {art, titel, dateiname, docs}

    if (tagesfahrten.length) {
      const blaetter = [];
      for (let i = 0; i < tagesfahrten.length; i += ZEILEN_JE_ANLAGE) blaetter.push(tagesfahrten.slice(i, i + ZEILEN_JE_ANLAGE));
      teile.push({ art: "antrag", titel: `Antrag 035_002 für ${tagesfahrten.length} Tagesfahrt${tagesfahrten.length === 1 ? "" : "en"}`, dateiname: "Antrag_035_002",
        docs: [await fuelle(PDFLib, antragBytes, werteAntrag(profil, tagesfahrten, blaetter.length), "Antrag", zuLang)] });
      const anlageDocs = [];
      for (let i = 0; i < blaetter.length; i++) {
        anlageDocs.push(await fuelle(PDFLib, anlageBytes, werteAnlage(profil, blaetter[i]), `Anlage Blatt ${i + 1}`, zuLang));
      }
      teile.push({ art: "anlage", titel: `Anlage 035_016 (${blaetter.length} Blatt)`, dateiname: "Anlage_035_016", docs: anlageDocs });
    }
    for (const x of mehrtaegig) {
      teile.push({ art: "mehrtaegig", titel: `Antrag 035_002 für die Reise ${deDatum(x.f.datum).slice(0, 6)}–${deDatum(x.f.datumBis)}`,
        dateiname: `Antrag_035_002_${x.f.datum}_bis_${x.f.datumBis}`,
        docs: [await fuelle(PDFLib, antragBytes, werteAntragMehrtaegig(profil, x), `Antrag ${deDatum(x.f.datum)}`, zuLang)] });
    }

    let seite = 1;
    for (const t of teile) {
      t.bytes = await zusammenfuegen(PDFLib, t.docs);
      t.seiten = t.docs.reduce((s, d) => s + d.getPageCount(), 0);
      t.vonSeite = seite; seite += t.seiten;
      delete t.docs;
    }
    const gesamt = await PDFLib.PDFDocument.create();
    for (const t of teile) {
      const d = await PDFLib.PDFDocument.load(t.bytes);
      const seiten = await gesamt.copyPages(d, d.getPageIndices());
      seiten.forEach((s) => gesamt.addPage(s));
    }
    return { bytes: await gesamt.save(), teile, zuLang, seiten: seite - 1 };
  }

  const Kern = { SATZ_KLEIN, SATZ_GROSS, SATZ_FAHRRAD, DECKEL_KLEIN, TAGEGELD, TAGEGELD_VOLL, GRUENDE,
    UEBERNACHTUNG_PAUSCHAL, UEBERNACHTUNG_GRENZE, UEBERNACHTUNG_KOMPAKT,
    isoHeute, deDatum, fristEnde, berechne, istMehrtaegig, g2Vorschlag, g4Vorschlag, werteAntrag, werteAntragMehrtaegig, werteAnlage, erzeugePdf, eur, km };

})(typeof globalThis !== "undefined" ? globalThis : this);

// ------------------------------------------------------------ Speicher
// Mit Claude-Konto: db (privat je Person, auf allen Geräten). Sonst: dieser Browser.
// Zusätzlich hält jedes Gerät automatisch die letzten Stände als Sicherung vor (siehe Spiegel).
const Store = {
  mode: "local", docs: {}, col: null, listeners: [], bereit: false,
  async init() {
    const fertig = () => { this.spiegeln(); this.listeners.forEach((fn) => fn()); };
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]); } catch (e) {}
    const uid = user ? await user.id() : null;
    if (db && uid) {
      this.mode = "db";
      this.col = db.collection("data/users/" + uid);
      const timer = setTimeout(() => { if (!this.bereit) { ui.netzHinweis = true; this.bereit = true; fertig(); } }, 10000);
      this.col.onSnapshot((snap) => {
        const docs = {};
        snap.docs.forEach((d) => { if (d.exists) docs[d.id] = d.data(); });
        this.docs = docs;
        // Ein leerer Zwischenstand aus dem Cache ist noch nicht die Antwort des Speichers
        if (!snap.metadata.fromCache) { clearTimeout(timer); ui.netzHinweis = false; this.bereit = true; }
        else if (snap.size) this.bereit = true;
        if (this.bereit) fertig();
      }, (err) => { clearTimeout(timer); ui.fehler = "Deine Daten sind gerade nicht erreichbar. Lade die Seite später neu."; this.bereit = true; fertig(); });
    } else {
      // Auf claude.ai sollte der Konto-Speicher da sein; fehlt er, deutlich darauf hinweisen
      if (window.claude) ui.speicherWarnung = true;
      try { this.docs = JSON.parse(localStorage.getItem("fahrtkosten-v1") || "{}"); } catch (e) { this.docs = {}; }
      try { navigator.storage?.persist?.(); } catch (e) {}
      this.bereit = true;
      fertig();
    }
  },
  async put(id, obj) {
    this.docs = { ...this.docs, [id]: obj };
    if (this.mode === "db") await this.col.doc(id).set(JSON.parse(JSON.stringify(obj)));
    else this.saveLocal();
    this.spiegeln();
    if (this.mode === "local") this.listeners.forEach((fn) => fn());
  },
  async del(id) {
    const { [id]: _, ...rest } = this.docs;
    this.docs = rest;
    if (this.mode === "db") await this.col.doc(id).delete();
    else { this.saveLocal(); this.listeners.forEach((fn) => fn()); }
  },
  saveLocal() {
    try { localStorage.setItem("fahrtkosten-v1", JSON.stringify(this.docs)); }
    catch (e) { toast("Speichern auf diesem Gerät ist fehlgeschlagen. Bitte eine Sicherung herunterladen."); }
  },
  // Spiegel: bis zu 5 Stände im Gerätespeicher, höchstens einer je halbe Stunde. Leere Stände werden nie gesichert,
  // ältere Stände bleiben stehen – so überlebt eine Sicherung auch ein versehentliches Löschen.
  spiegeln() {
    if (!this.bereit || !Object.keys(this.docs).length) return;
    try {
      const verlauf = sicherungen();
      const jetzt = Date.now();
      const eintrag = { zeit: jetzt, docs: this.docs };
      const alt = verlauf[0];
      // Den jüngsten Stand nur fortschreiben, wenn dabei nichts verloren geht – sonst bleibt er als Rettung stehen
      const nichtsWeg = alt && (!alt.docs.profil?.name || this.docs.profil?.name)
        && Object.keys(this.docs).length >= Object.keys(alt.docs).length;
      if (alt && jetzt - alt.zeit < 30 * 60 * 1000 && nichtsWeg) verlauf[0] = eintrag;
      else verlauf.unshift(eintrag);
      localStorage.setItem("fahrtkosten-verlauf", JSON.stringify(verlauf.slice(0, 5)));
    } catch (e) {}
  },
};

function sicherungen() {
  try { return JSON.parse(localStorage.getItem("fahrtkosten-verlauf") || "[]").filter((s) => s && s.docs); } catch (e) { return []; }
}

function sicherungText(s) {
  const p = s.docs.profil || {};
  const n = Object.keys(s.docs).filter((k) => k.startsWith("f-")).length;
  const zeit = new Date(s.zeit).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  return `${zeit} Uhr: ${p.name ? p.name + ", " : ""}${n} Fahrt${n === 1 ? "" : "en"}`;
}

  // oder wenn ausdrücklich dieser Stand gewählt wurde.
  for (const [id, doc] of Object.entries(s.docs)) {
    if (!/^(profil|orte|f-[\w-]+)$/.test(id) || !doc || typeof doc !== "object") continue;
    const ersetzen = angabenUeberschreiben && (id === "profil" || id === "orte");
    if (!Store.docs[id] || ersetzen) await Store.put(id, doc);
  }
  if (!Store.docs.profil?.name && s.docs.profil) await Store.put("profil", s.docs.profil);
}

/** Sicherung, aus der sich fehlende Angaben zurückholen lassen (z. B. wenn das Profil plötzlich leer ist). */
function rettungsSicherung() {
  if (profil()?.name) return null;
  return sicherungen().find((s) => s.docs.profil?.name && !s.docs.profil.beispiel) || null;
}

function profil() { return Store.docs.profil || null; }
function orte() { return Store.docs.orte || { orte: [], entfernungen: [] }; }
function fahrten() {
  return Object.entries(Store.docs).filter(([id]) => id.startsWith("f-"))
    .map(([id, f]) => ({ ...f, id })).sort((a, b) => (b.datum + b.abfahrt).localeCompare(a.datum + a.abfahrt));
}
function neueId() { return "f-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ------------------------------------------------------------ Oberfläche
const ui = { view: "fahrten", draft: null, abr: null, toast: "", netzHinweis: false, fehler: "", loeschen: false, bestaetigen: "" };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tagLabel = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short" });
const monatLabel = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { month: "long", year: "numeric" });

function toast(text) {
  ui.toast = text;
  const alt = $(".toast"); if (alt) alt.remove();
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function gehe(view) {
  ui.view = view; ui.loeschen = false; ui.bestaetigen = "";
  document.querySelectorAll("nav.tabs button").forEach((b) => b.toggleAttribute("aria-current", false));
  const tab = view === "edit" ? "fahrten" : view;
  const btn = $(`nav.tabs [data-tab="${tab}"]`); if (btn) btn.setAttribute("aria-current", "page");
  render(); window.scrollTo(0, 0);
}

function eingerichtet() {
  const p = profil(), o = orte();
  return !!(p && p.name && p.iban && o.orte.some((x) => x.typ === "wohnung") && o.orte.length >= 2);
}

function render() {
  const main = $("#main");
  if (!Store.bereit) return;  // erst zeichnen, wenn der Speicher geantwortet hat – sonst wirkt alles leer
  if (ui.fehler) { main.innerHTML = `<div class="banner bad">${esc(ui.fehler)}</div>`; return; }
  profilJetztSpeichern();  // ungespeicherte Eingaben im Profil nie durch Neuzeichnen verlieren
  const v = { fahrten: viewFahrten, edit: viewEdit, abrechnen: viewAbrechnen, einstellungen: viewEinstellungen }[ui.view];
  main.innerHTML = v();
  const hook = { edit: hookEdit, abrechnen: hookAbrechnen, einstellungen: hookEinstellungen, fahrten: hookFahrten }[ui.view];
  if (hook) hook();
  const weiter = $("#entwurf-weiter");
  if (weiter) weiter.addEventListener("click", () => { const e = entwurf(); if (e) { ui.draft = e.draft; gehe("edit"); } });
  const weg = $("#entwurf-weg");
  if (weg) weg.addEventListener("click", () => { entwurfVergessen(); render(); });
  const rettung = $("#rettung");
  if (rettung) rettung.addEventListener("click", async () => {
    const s = rettungsSicherung(); if (!s) return;
    await sicherungEinspielen(s); toast("Angaben wiederhergestellt"); render();
  });
}

function beispielBanner() {
  const rettung = rettungsSicherung();
  return entwurfBanner() + (ui.speicherWarnung ? `<div class="banner bad">Dein Konto-Speicher antwortet gerade nicht. Änderungen landen nur auf diesem Gerät. Bitte die Seite neu laden.</div>` : "")
    + (rettung ? `<div class="banner warn stack" style="gap:8px"><span>Deine persönlichen Angaben fehlen. Auf diesem Gerät gibt es eine automatische Sicherung vom ${esc(sicherungText(rettung))}.</span>
        <button class="btn primary" id="rettung" style="align-self:flex-start">Angaben wiederherstellen</button></div>` : "")
    + (Object.values(Store.docs).some((d) => d && d.beispiel)
      ? `<div class="banner warn">Hier stehen Beispieldaten (Max Mustermann). Unter „Meine Daten“ kannst du sie löschen und deine eigenen eintragen.</div>` : "");
}

// ---------- Fahrten

function viewFahrten() {
  const alle = fahrten().map((f) => ({ f, r: K.berechne(f, orte()) }));
  if (!eingerichtet() && !alle.length) return viewWillkommen();
  const offen = alle.filter(({ f }) => !f.abgerechnetAm);
  const okOffen = offen.filter(({ r }) => !r.fehler.length);
  const summe = okOffen.reduce((s, { r }) => s + r.summe, 0);
  const fristen = okOffen.map(({ r }) => r.fristEnde).sort();
  let html = `<div class="top"><h1>Fahrten</h1><span class="muted small">${Store.mode === "db" ? "in deinem Konto gespeichert" : "nur auf diesem Gerät"}</span></div>
    <div class="stack">${beispielBanner()}${ui.netzHinweis ? `<div class="banner warn">Verbindung langsam. Angezeigte Daten sind evtl. nicht aktuell.</div>` : ""}
    <div class="stub"><div><div class="eyebrow">Noch nicht abgerechnet</div>
      <div><b>${okOffen.length}</b> Fahrt${okOffen.length === 1 ? "" : "en"}${offen.length > okOffen.length ? `, <span style="color:var(--bad)">${offen.length - okOffen.length} unvollständig</span>` : ""}</div>
      <div class="muted small">${fristen.length ? `Erste Frist endet am ${K.deDatum(fristen[0])}` : "Keine Frist offen"}</div></div>
      <div class="betrag"><span class="eyebrow">voraussichtlich</span><span class="num">${K.eur(summe)} €</span>
        <span class="small" style="opacity:.8">davon Tagegeld ${K.eur(okOffen.reduce((s, { r }) => s + r.tagegeld, 0))} €</span></div></div></div>`;
  if (!alle.length) {
    html += `<div class="card stack" style="margin-top:16px"><h3>Noch keine Fahrten</h3><p class="muted">Tippe auf „Neue Fahrt“, am besten direkt nach dem Seminar. Datum, Route und Uhrzeiten reichen.</p></div>`;
  }
  let monat = "";
  alle.forEach(({ f, r }, i) => {
    const m = f.datum.slice(0, 7);
    if (m !== monat) { html += `${monat ? "</div></section>" : ""}<section class="month"><h3>${monatLabel(f.datum)}</h3><div class="list">`; monat = m; }
    const doppelt = !f.abgerechnetAm && konflikte(f, f.id).length;
    const status = f.abgerechnetAm ? `<span class="chip ok">abgerechnet</span>` : r.fehler.length ? `<span class="chip bad">unvollständig</span>`
      : doppelt ? `<span class="chip warn">doppelt?</span>`
      : r.hinweise.length ? `<span class="chip warn">offen · Hinweis</span>` : `<span class="chip">offen</span>`;
    const mehr = K.istMehrtaegig(f);
    const tag = mehr ? `${r.tage || ""} Tage<b>${K.deDatum(f.datum).slice(0, 6)}</b>bis ${K.deDatum(f.datumBis).slice(0, 6)}` : `${tagLabel(f.datum)}<b>${K.deDatum(f.datum).slice(0, 6)}</b>`;
    html += `<button class="item" data-edit="${esc(f.id)}"><span class="tag">${tag}</span>
      <span class="grow"><span class="route">${esc((f.route || []).join(" → "))}</span><br><span class="muted small">${mehr ? "mit Übernachtung · " : ""}${MITTEL[f.verkehrsmittel] || ""}${f.grund ? " · " + esc(f.grund) : ""}${r.tagegeld ? " · Tagegeld" : ""} · ${status}</span></span>
      <span class="amount"><span class="num">${r.fehler.length ? "–" : K.eur(r.summe) + " €"}</span><br><span class="muted small num">${r.km ? K.km(r.km) + " km" : ""}</span></span></button>`;
  });
  if (monat) html += "</div></section>";
  html += `<button class="btn primary fab" id="neu">+ Neue Fahrt</button>`;
  return html;
}

function hookFahrten() {
  document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => {
    const f = Store.docs[b.dataset.edit];
    ui.draft = { ...JSON.parse(JSON.stringify(f)), id: b.dataset.edit, neu: false };
    gehe("edit");
  }));
  const n = $("#neu"); if (n) n.addEventListener("click", neueFahrt);
  const w = $("#willkommen-start"); if (w) w.addEventListener("click", () => gehe("einstellungen"));
  const b = $("#willkommen-beispiel"); if (b) b.addEventListener("click", beispielLaden);
}

  return `<div class="stack"><h1>Fahrtkosten Vorbereitungsdienst</h1>${beispielBanner()}

function neueFahrt() {
  if (!eingerichtet()) { toast("Bitte zuerst deine Daten und Orte eintragen"); gehe("einstellungen"); return; }
  const letzte = fahrten()[0];
  const o = orte().orte;
  const wohnung = (o.find((x) => x.typ === "wohnung") || {}).name;
  const seminar = (o.find((x) => x.typ === "seminar") || {}).name;
  ui.draft = { id: neueId(), neu: true, datum: K.isoHeute(),
    route: letzte ? [...letzte.route] : [wohnung, seminar, wohnung].filter(Boolean),
    unterrichtVon: "", unterrichtBis: "", abfahrt: letzte?.abfahrt || "", anlass: "a", anlassText: "",

function schnellRouten() {
  const gesehen = new Set(), liste = [];
  for (const f of fahrten()) {
    const k = (f.route || []).join(" > ");
    if (k && !gesehen.has(k)) { gesehen.add(k); liste.push(f.route); }
    if (liste.length >= 4) break;
  }
  return liste;
}

function zahl(text) { const n = parseFloat(String(text).replace(/\./g, "").replace(",", ".")); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; }

function renderRoute() {
  const d = ui.draft;
  $("#route").innerHTML = (d.route || []).map((s, i) => `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ""}<span class="stop">${esc(s)}<button type="button" data-weg="${i}" aria-label="${esc(s)} entfernen">×</button></span>`).join("")
    || `<span class="muted small">Tippe unten die Stationen in der gefahrenen Reihenfolge an.</span>`;
  $("#addstops").innerHTML = orte().orte.map((o) => `<button type="button" data-plus="${esc(o.name)}">+ ${esc(o.name)}</button>`).join("");
  $("#route").querySelectorAll("[data-weg]").forEach((b) => b.addEventListener("click", () => { d.route.splice(+b.dataset.weg, 1); renderRoute(); renderErgebnis(); }));
  $("#addstops").querySelectorAll("[data-plus]").forEach((b) => b.addEventListener("click", () => { d.route = [...(d.route || []), b.dataset.plus]; renderRoute(); renderErgebnis(); }));
}

/** Doppelte Tage und Überschneidungen mit mehrtägigen Reisen – sonst würde z. B. Tagegeld doppelt abgerechnet. */
function konflikte(f, id) {
  if (!f.datum) return [];
  const ende = (x) => (K.istMehrtaegig(x) ? x.datumBis : x.datum);
  const spanne = (x) => (K.istMehrtaegig(x) ? `${K.deDatum(x.datum).slice(0, 6)}–${K.deDatum(x.datumBis)}` : K.deDatum(x.datum));
  return fahrten().filter((o) => o.id !== id && o.datum && o.datum <= ende(f) && f.datum <= ende(o)).map((o) =>
    K.istMehrtaegig(o) || K.istMehrtaegig(f)
      ? `Überschneidet sich mit der Fahrt ${spanne(o)}. Bitte prüfen, sonst wird Tagegeld doppelt abgerechnet.`
      : `Am ${K.deDatum(o.datum)} gibt es schon eine Fahrt. Doppelt eingetragen?`);
}

function renderErgebnis() {
  const r = K.berechne(ui.draft, orte());
  r.hinweise.unshift(...konflikte(ui.draft, ui.draft.id));
  const teile = [];
  if (r.km) teile.push(`<span class="num">${K.km(r.km)} km</span>`);
  if (r.satz) teile.push(`<span class="num">× ${K.eur(r.satz)} €</span>`);
  if (r.tagegeld) teile.push(`<span>+ Tagegeld ${K.eur(r.tagegeld)} €</span>`);
  if (r.uebernachtungsgeld || r.uebernachtungskosten) teile.push(`<span>+ Übernachtung ${K.eur(r.uebernachtungsgeld + r.uebernachtungskosten)} €</span>`);
  if (ui.draft.verkehrsmittel === "mitfahrt" && r.km) teile.push(`<span>(Mitfahrt: keine km-Erstattung)</span>`);
  $("#ergebnis").innerHTML = `<div class="zahlen"><span class="muted small">${teile.join(" ") || "Noch keine Berechnung"}</span>
    <span class="summe">${r.fehler.length ? "–" : K.eur(r.summe) + " €"}</span></div>
    ${r.tagegeldText ? `<div class="tagegeld ${r.tagegeld ? "ja" : ""}">${esc(r.tagegeldText)}</div>` : ""}`;
  const hint = $("#zeit-hint");
  if (hint) hint.textContent = ui.draft.mehrtaegig ? "" : r.beginnIn === "Dienstort"
    ? "Hinfahrt: Start an der Ausbildungsschule nach dem Unterricht. Rückfahrt: wann du wieder zu Hause bist. Die Zeit an der Schule zählt nicht für das Tagegeld."
    : "Hinfahrt: wann du zu Hause losfährst. Rückfahrt: wann du wieder zu Hause bist. Nicht die Ankunft am Seminar!";
  const knopf = $("#tg-knopf");
  if (knopf && !ui.draft.mehrtaegig) {
    knopf.setAttribute("aria-pressed", String(r.tagegeldGewaehlt));
    knopf.textContent = r.tagegeldGewaehlt ? `Tagegeld beantragt (${K.eur(K.TAGEGELD)} €)` : `Tagegeld beantragen (${K.eur(K.TAGEGELD)} €)`;
    const wahl = ui.draft.tagegeldWahl;
    $("#tg-hint").textContent = wahl === "ja" || wahl === "nein"
      ? "Von dir festgelegt." + (r.abwesenheit ? ` Laut Uhrzeiten ${r.tagegeldAutomatisch ? "mehr" : "nicht mehr"} als 8 Std. unterwegs.` : "")
      : r.abwesenheit ? `Automatisch nach den Uhrzeiten (${r.tagegeldAutomatisch ? "mehr" : "nicht mehr"} als 8 Std. unterwegs). Antippen zum Ändern.`
        : "Wird automatisch gesetzt, sobald Hin- und Rückfahrt eingetragen sind. Oder hier antippen.";
    $("#tg-auto").hidden = !(wahl === "ja" || wahl === "nein");
  }
  const rueck = $("#rueckweg");
  if (rueck) {

    rueck.hidden = !(r.rueckwegFehlt && start);

  }
  $("#ergebnis").insertAdjacentHTML("beforeend",
    r.fehler.length || r.hinweise.length ? `<ul class="msgs">${r.fehler.map((t) => `<li class="bad">${esc(t)}</li>`).join("")}${r.hinweise.map((t) => `<li class="warn">${esc(t)}</li>`).join("")}</ul>` : "");
}

  const offen = fahrten().filter((f) => !f.abgerechnetAm);

  return { von: daten[0] || K.isoHeute(), bis: daten[daten.length - 1] || K.isoHeute(), aus: null, erstellt: null };
}

function abrListe() {
  const a = ui.abr;

    .sort((x, y) => x.f.datum.localeCompare(y.f.datum));
}

function inhaltText(gewaehlt) {
  const tages = gewaehlt.filter(({ r }) => !r.mehrtaegig).length, mehr = gewaehlt.length - tages;
  const teile = [];
  if (tages) teile.push(`Antrag + ${Math.ceil(tages / 15)} Blatt Anlage`);
  if (mehr) teile.push(`${mehr} eigene${mehr === 1 ? "r" : ""} Antrag für mehrtägige Reise${mehr === 1 ? "" : "n"}`);
  return teile.join(" · ") || "Nichts ausgewählt";
}

function alsBase64(daten) {
  const bytes = typeof daten === "string" ? new TextEncoder().encode(daten) : new Uint8Array(daten);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

async function speichereDatei(name, daten, typ) {
  // Android-App: die Datei landet über die Brücke im Download-Ordner des Handys
  if (window.AndroidApp) {
    const antwort = window.AndroidApp.speichere(name, alsBase64(daten), typ);
    if (!String(antwort).startsWith("ok")) throw new Error(String(antwort).replace(/^fehler:\s*/, ""));
    return;
  }
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) { await dl.save({ filename: name, data: new Blob([daten], { type: typ }) }); return; }
  const url = URL.createObjectURL(new Blob([daten], { type: typ }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function b64(id) {
  const s = $(id).textContent.trim(); const bin = atob(s); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

    render();
    await speichereMitMeldung(`${a.erstellt.name}.pdf`, out.bytes, out.zuLang.length
      ? `<br>Bitte im Ausdruck prüfen:<br>${out.zuLang.map((z) => "· " + esc(z)).join("<br>")}` : "");
  });
  hookAbrechnenRest();
  zeigeErstellt();
}

async function speichereMitMeldung(name, bytes, zusatz = "") {
  const status = $("#pdf-status");
  try {
    await speichereDatei(name, bytes, "application/pdf");
    status.innerHTML = `<div class="banner good">${esc(name)} gespeichert${window.AndroidApp ? " (Ordner Download/Fahrtkosten)" : ""}.${zusatz}</div>`;
  } catch (err) {
    status.innerHTML = err && err.code === "declined"
      ? `<div class="banner warn">Speichern abgebrochen. Du kannst die Dateien unten jederzeit erneut speichern.</div>`
      : window.AndroidApp
        ? `<div class="banner bad">Speichern ging nicht: ${esc(err && err.message)}</div>`
        : `<div class="banner bad">Speichern ging in dieser Ansicht nicht. Öffne die App im Browser auf claude.ai und versuche es dort.</div>`;
  }
}

// Vorschau aller Seiten mit pdf.js, damit Antrag und Anlage direkt in der App sichtbar sind
let pdfjsLaden = null;
function ladePdfjs() {
  const skript = (src) => new Promise((ok, fehler) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fehler; document.head.appendChild(s); });
  pdfjsLaden = pdfjsLaden || skript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js")
    .then(() => skript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"))
    .then(() => window.pdfjsLib);
  return pdfjsLaden;
}

let vorschauLauf = 0;
async function zeigeVorschau(out) {
  const ziel = $("#vorschau"); if (!ziel) return;
  const lauf = ++vorschauLauf;
  try {
    const pdfjs = await ladePdfjs();
    const doc = await pdfjs.getDocument({ data: out.bytes.slice(0), isEvalSupported: false }).promise;
    const breite = Math.min(ziel.clientWidth || 600, 900);
    const titel = [];
    out.teile.forEach((t) => { for (let i = 0; i < t.seiten; i++) titel.push(`${t.titel}${t.seiten > 1 ? `, Seite ${i + 1}` : ""}`); });
    ziel.innerHTML = "";
    for (let n = 1; n <= doc.numPages; n++) {
      if (!ziel.isConnected || lauf !== vorschauLauf) return;
      const seite = await doc.getPage(n);
      const basis = seite.getViewport({ scale: 1 });
      const vp = seite.getViewport({ scale: (breite / basis.width) * Math.min(window.devicePixelRatio || 1, 2) });
      const fig = document.createElement("figure"); const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height; c.setAttribute("aria-label", `Vorschau Seite ${n}`);
      const cap = document.createElement("figcaption"); cap.textContent = `Seite ${n}: ${titel[n - 1] || ""}`;
      fig.append(c, cap); ziel.appendChild(fig);
      await seite.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
  } catch (err) {
    ziel.innerHTML = `<p class="muted small">Die Vorschau lässt sich hier nicht anzeigen. Die PDF-Dateien oben sind trotzdem vollständig.</p>`;
  }
}

function zeigeErstellt() {
  const a = ui.abr; if (!a || !a.erstellt) return;
  document.querySelectorAll("[data-teil]").forEach((b) => b.addEventListener("click", () => {
    const t = a.erstellt.out.teile[+b.dataset.teil];
    speichereMitMeldung(`${t.dateiname}_${a.erstellt.name.replace("Reisekosten_", "")}.pdf`, t.bytes);
  }));
  const alles = $("#alles-speichern"); if (alles) alles.addEventListener("click", () => speichereMitMeldung(`${a.erstellt.name}.pdf`, a.erstellt.out.bytes));
  zeigeVorschau(a.erstellt.out);
}

function hookAbrechnenRest() {
  const a = ui.abr;
  const m = $("#markieren"); if (m) m.addEventListener("click", () => { ui.bestaetigen = "markieren"; render(); });
  const mn = $("#mark-nein"); if (mn) mn.addEventListener("click", () => { ui.bestaetigen = ""; render(); });
  const mj = $("#mark-ja"); if (mj) mj.addEventListener("click", async () => {
    const heute = K.isoHeute();
    for (const id of a.erstellt.ids) await Store.put(id, { ...Store.docs[id], abgerechnetAm: heute });
    toast(`${a.erstellt.ids.length} Fahrten als abgerechnet markiert`);
    ui.abr = null; ui.bestaetigen = ""; render();
  });
  document.querySelectorAll("[data-zurueck]").forEach((b) => b.addEventListener("click", () => { ui.bestaetigen = "zurueck-" + b.dataset.zurueck; render(); }));
  const zn = $("#zurueck-nein"); if (zn) zn.addEventListener("click", () => { ui.bestaetigen = ""; render(); });
  document.querySelectorAll("[data-zurueck-ja]").forEach((b) => b.addEventListener("click", async () => {

    for (const f of fahrten().filter((x) => x.abgerechnetAm === tag)) { const { id, ...rest } = f; await Store.put(id, { ...rest, abgerechnetAm: "" }); }
    toast("Wieder als offen markiert"); ui.abr = null; ui.bestaetigen = ""; render();
  }));
}
