# Veröffentlicht die Webseite (Startseite, App, APK, Anleitung) bei GitHub Pages.
# Einmalig einrichten: Repo öffentlich, dann Settings → Pages → Source: „GitHub Actions“.
# Adresse: https://menkoban.github.io/Fahrtkostenabrechnung-Studienseminar/
name: Webseite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regeltests
        run: node --test tests/kern.test.js
      - name: Webseite bauen
        run: python app/build.py
      - name: Fertige Dateien im Repo sind aktuell
        # Fahrtkosten-App.html wird aus app/ gebaut; weicht sie ab, wurde nach einer Änderung nicht neu gebaut
        run: git diff --exit-code -- Fahrtkosten-App.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/web

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
